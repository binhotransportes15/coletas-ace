<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>BINHO · COLETA</title>
  <style>
    html, body {
      height: 100%; margin: 0;
      background: #05080f; color: #e2e8f0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .wrap {
      min-height: 100%; display: grid; place-items: center;
      padding: 24px; text-align: center;
    }
    .msg { color: #94a3b8; font-size: 14px; }
  </style>
  <script>
    (async function boot() {
      var hash = location.hash || '';
      var search = location.search || '';
      try {
        var r = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
        var d = await r.json();
        if (d && (d.online === false || d.online === 'false' || d.online === 0)) {
          location.replace('offline.html' + search + hash);
          return;
        }
      } catch (e) { /* se falhar, abre o app */ }
      location.replace('app.html' + search + hash);
    })();
  </script>
</head>
<body>
  <div class="wrap"><div class="msg">Carregando COLETA…</div></div>
</body>
</html>
