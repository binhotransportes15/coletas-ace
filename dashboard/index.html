<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BINHO · COLETA</title>
  <script src="config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #0b1220;
      --line: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --col: #22c55e;
      --com: #38bdf8;
      --cad: #f59e0b;
      --can: #ef4444;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(1100px 520px at 8% -10%, #132038 0%, transparent 55%),
        radial-gradient(800px 420px at 100% 0%, #1a1020 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      height: 100vh;
    }

    .board {
      height: 100vh;
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 12px 14px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, #0f172a, #0b1220);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 14px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { height: 46px; width: auto; display: block; object-fit: contain; }
    .brand .title {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .clock-box { text-align: right; }
    .clock-box .lbl {
      color: var(--muted); font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .clock-box .time {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .clock-box .date { color: var(--muted); font-size: 11px; }

    /* Layout principal: pops | torres | urgentes */
    .stage {
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      gap: 12px;
      min-height: 0;
      height: 100%;
    }

    .side {
      background: rgba(12, 18, 32, 0.55);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .side h2 {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .total-num {
      font-size: 56px;
      font-weight: 200;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: #fff;
    }
    .total-sub { color: var(--muted); font-size: 12px; margin: 4px 0 14px; }

    /* Stack de pops */
    .pop-stack {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .pop {
      position: absolute;
      left: 0; right: 0;
      display: grid;
      align-items: center;
      gap: 10px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      transition:
        opacity .45s ease,
        transform .55s cubic-bezier(.2,.8,.2,1),
        top .55s cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }
    .pop.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .pop.leaving {
      opacity: 0;
      transform: translateY(-34px) scale(0.96);
    }

    .pop-placa {
      grid-template-columns: 48px 1fr auto;
    }
    .pop-prazo {
      grid-template-columns: 58px 1fr auto;
      border-left: 4px solid var(--can);
    }
    .pop-prazo.warn {
      border-left-color: var(--cad);
    }

    .donut { width: 44px; height: 44px; position: relative; }
    .donut svg { width: 44px; height: 44px; transform: rotate(-90deg); }
    .donut .pct {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 11px; font-weight: 800; color: #fff;
    }
    .pop .name { font-size: 15px; font-weight: 800; letter-spacing: 0.03em; }
    .pop .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .pop .badge {
      font-size: 13px; font-weight: 800; color: var(--col);
      font-variant-numeric: tabular-nums;
    }
    .pop-prazo .hora {
      font-size: 18px; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .pop-prazo .tag {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      padding: 4px 7px; border-radius: 999px;
      background: #450a0a; color: #fecaca; white-space: nowrap;
    }
    .pop-prazo.warn .tag {
      background: #1e293b; color: var(--cad);
    }

    /* Torres centro */
    .center {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 10px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .center h2 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
    }
    .torres {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 18px;
      min-height: 0;
      padding: 8px 8px 0;
    }
    .torre {
      width: min(132px, 18vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: none;
      background: transparent;
      padding: 0;
      color: inherit;
    }
    .torre .pin {
      width: 34px; height: 34px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: grid; place-items: center;
      margin-bottom: 10px;
      box-shadow: 0 6px 14px rgba(0,0,0,.35);
    }
    .torre .pin span {
      transform: rotate(45deg);
      font-size: 11px; font-weight: 800; color: #fff;
    }
    .torre .barra {
      width: 100%;
      min-height: 56px;
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 14px;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      transition: height .45s ease;
    }
    .torre .barra strong {
      font-size: clamp(24px, 3.2vw, 36px);
      font-weight: 300; color: #fff; line-height: 1;
    }
    .torre .faixa {
      width: 100%; padding: 8px 6px; color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase;
      clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
    }
    .torre .base {
      width: 100%; background: #0f172a;
      border: 1px solid var(--line); border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 9px 6px 11px; text-align: center;
    }
    .torre .base .qtd { font-size: 18px; font-weight: 700; display: block; }
    .torre .base .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .t-col .pin, .t-col .barra { background: var(--col); }
    .t-col .faixa { background: #16a34a; }
    .t-col .base .qtd { color: var(--col); }
    .t-com .pin, .t-com .barra { background: var(--com); }
    .t-com .faixa { background: #0284c7; }
    .t-com .base .qtd { color: var(--com); }
    .t-cad .pin, .t-cad .barra { background: var(--cad); }
    .t-cad .faixa { background: #d97706; }
    .t-cad .base .qtd { color: var(--cad); }
    .t-can .pin, .t-can .barra { background: var(--can); }
    .t-can .faixa { background: #dc2626; }
    .t-can .base .qtd { color: var(--can); }

    .status-line { color: var(--muted); font-size: 11px; padding: 0 4px; }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .board { height: auto; min-height: 100vh; }
      .stage { grid-template-columns: 1fr; height: auto; }
      .pop-stack { min-height: 220px; }
      .torres { min-height: 280px; }
    }
  </style>
</head>
<body>
  <div class="board">
    <header class="topbar">
      <div class="brand">
        <img src="logo-binho.png" alt="BINHO Transportes" />
        <div class="title">COLETA</div>
      </div>
      <div class="clock-box">
        <div class="lbl">Tempo real</div>
        <div class="time" id="clock">--:--:--</div>
        <div class="date" id="clockDate">—</div>
      </div>
    </header>

    <div class="stage">
      <!-- ESQUERDA: total + pops de placa -->
      <aside class="side">
        <h2>Total</h2>
        <div class="total-num" id="totalColetas">0</div>
        <div class="total-sub" id="totalSub">coletas</div>
        <h2>Placas</h2>
        <div class="pop-stack" id="placaStack"></div>
      </aside>

      <!-- CENTRO: torres -->
      <section class="center">
        <h2>Torres · tempo real</h2>
        <div class="torres">
          <div class="torre t-col">
            <div class="pin"><span>01</span></div>
            <div class="barra" id="barReal"><strong id="nReal">0</strong></div>
            <div class="faixa">Realizada</div>
            <div class="base"><span class="qtd" id="qReal">0</span><div class="lbl">coletada</div></div>
          </div>
          <div class="torre t-com">
            <div class="pin"><span>02</span></div>
            <div class="barra" id="barRota"><strong id="nRota">0</strong></div>
            <div class="faixa">Em rota</div>
            <div class="base"><span class="qtd" id="qRota">0</span><div class="lbl">comandada</div></div>
          </div>
          <div class="torre t-cad">
            <div class="pin"><span>03</span></div>
            <div class="barra" id="barPar"><strong id="nPar">0</strong></div>
            <div class="faixa">Parado</div>
            <div class="base"><span class="qtd" id="qPar">0</span><div class="lbl">cadastrada</div></div>
          </div>
          <div class="torre t-can">
            <div class="pin"><span>04</span></div>
            <div class="barra" id="barCan"><strong id="nCan">0</strong></div>
            <div class="faixa">Cancelada</div>
            <div class="base"><span class="qtd" id="qCan">0</span><div class="lbl">SPO</div></div>
          </div>
        </div>
      </section>

      <!-- DIREITA: pops de prazo -->
      <aside class="side">
        <h2>Perto do limite</h2>
        <div class="pop-stack" id="prazoStack"></div>
      </aside>
    </div>

    <p class="status-line" id="statusLine">BINHO · COLETA</p>
  </div>

  <script>
    const SCRIPT_URL = (window.ACE_CONFIG && window.ACE_CONFIG.scriptUrl) || '';
    const JANELA_MIN = 120;
    const PLACA_VISIBLE = 3;
    const PRAZO_VISIBLE = 4;
    const PLACA_TICK_MS = 2800;
    const PRAZO_TICK_MS = 3200;
    const PCT_ANIM_MS = 900;

    let COLETAS = [];
    let COLETAS_50 = [];
    let PLACAS = [];
    let URGENTES = [];
    let placaCursor = 0;
    let prazoCursor = 0;
    let placaTimer = null;
    let prazoTimer = null;

    function pad(n) { return String(n).padStart(2, '0'); }

    function tickClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
      document.getElementById('clockDate').textContent =
        `${dias[now.getDay()]} · ${pad(now.getDate())}/${pad(now.getMonth() + 1)}`;
    }

    async function chamarPlanilha(action) {
      if (!SCRIPT_URL) throw new Error('Configure scriptUrl em config.js');
      const url = new URL(SCRIPT_URL);
      url.searchParams.set('action', action);
      url.searchParams.set('t', String(Date.now()));
      const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      let dados;
      try { dados = JSON.parse(text); }
      catch { throw new Error('Apps Script inválido — publique Nova versão'); }
      if (!dados.ok) throw new Error(dados.error || 'Erro na planilha');
      return dados;
    }

    function coletaKey(r) {
      return String(r.coleta_id || r.coleta || `${r.unidade || ''}${r.numero || ''}`)
        .toUpperCase().replace(/\s+/g, '').trim();
    }

    function uniqueRows(rows) {
      const map = new Map();
      (rows || []).forEach(r => {
        const key = coletaKey(r);
        if (!key) return;
        if (!map.has(key)) map.set(key, r);
      });
      return Array.from(map.values());
    }

    function statusAce(c) {
      const raw = String(c.status_ace || '').toLowerCase().trim();
      if (['parado', 'em_rota', 'realizada', 'cancelada'].includes(raw)) return raw;
      const s = String(c.situacao_atual || '').toUpperCase();
      if (s.includes('CANCEL')) return 'cancelada';
      if (s.includes('COLET') || s.includes('REALIZ')) return 'realizada';
      if (s.includes('COMAND') || s.includes('ROTA')) return 'em_rota';
      if (s.includes('CADASTR') || s.includes('PARADO')) return 'parado';
      return 'outro';
    }

    function situacaoNorm50(c) {
      const s = String(c.situacao_atual || '').toUpperCase();
      if (s.includes('CANCEL')) return 'CANCELADA';
      if (s.includes('COLET')) return 'COLETADA';
      if (s.includes('COMAND')) return 'COMANDADA';
      if (s.includes('CADASTR')) return 'CADASTRADA';
      return '';
    }

    function parsePlaca(raw) {
      const text = String(raw || '').toUpperCase().trim();
      if (!text) return '';
      const m = text.match(/[A-Z]{3}\d[A-Z0-9]\d{2}|[A-Z]{3}\d{4}/);
      return m ? m[0] : text.split(/\s+/)[0];
    }

    function parseLimite(c) {
      const raw = String(c.data_hora_limite || '').trim();
      const now = new Date();
      let day = now.getDate(), month = now.getMonth() + 1, hour = 0, minute = 0, ok = false;
      let m = raw.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+(\d{1,2}):(\d{2})/);
      if (m) {
        day = +m[1]; month = +m[2]; hour = +m[4]; minute = +m[5]; ok = true;
      } else {
        const dOnly = String(c.data_limite_inicial || '').match(/(\d{1,2})\/(\d{1,2})/);
        const hOnly = raw.match(/(\d{1,2}):(\d{2})/) || String(c.hora || '').match(/(\d{1,2}):(\d{2})/);
        if (dOnly) { day = +dOnly[1]; month = +dOnly[2]; ok = true; }
        if (hOnly) { hour = +hOnly[1]; minute = +hOnly[2]; ok = true; }
      }
      if (!ok) return null;
      const year = now.getFullYear();
      const dt = new Date(year, month - 1, day, hour, minute, 0, 0);
      if (dt.getTime() - now.getTime() > 180 * 86400000) dt.setFullYear(year - 1);
      if (now.getTime() - dt.getTime() > 180 * 86400000) dt.setFullYear(year + 1);
      return dt;
    }

    function minsUntil(dt) {
      return Math.round((dt.getTime() - Date.now()) / 60000);
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function alturaTorre(valor, max) {
      const minH = 56, maxH = 220;
      if (!max || max <= 0) return minH;
      return Math.round(minH + (valor / max) * (maxH - minH));
    }

    function countByStatus(rows) {
      const out = { total: 0, parado: 0, em_rota: 0, realizada: 0, cancelada: 0, outro: 0 };
      rows.forEach(c => {
        const s = statusAce(c);
        out.total += 1;
        if (out[s] != null) out[s] += 1;
        else out.outro += 1;
      });
      return out;
    }

    function renderTorres(counts) {
      const max = Math.max(counts.realizada, counts.em_rota, counts.parado, counts.cancelada, 1);
      [
        ['Real', 'barReal', counts.realizada],
        ['Rota', 'barRota', counts.em_rota],
        ['Par', 'barPar', counts.parado],
        ['Can', 'barCan', counts.cancelada],
      ].forEach(([suf, bar, val]) => {
        document.getElementById('n' + suf).textContent = val;
        document.getElementById('q' + suf).textContent = val;
        document.getElementById(bar).style.height = alturaTorre(val, max) + 'px';
      });
      document.getElementById('totalColetas').textContent = String(counts.total);
      document.getElementById('totalSub').textContent = 'coletas no período';
    }

    function donutSvg(pct, color) {
      const p = Math.max(0, Math.min(100, pct || 0));
      const r = 15;
      const c = 2 * Math.PI * r;
      const dash = (p / 100) * c;
      return `<svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="${r}" fill="none" stroke="#1e293b" stroke-width="5"></circle>
        <circle class="arc" cx="20" cy="20" r="${r}" fill="none" stroke="${color}" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="0 ${c}" data-full="${dash} ${c - dash}"></circle>
      </svg>`;
    }

    function buildPlacas() {
      const byPlaca = new Map();
      COLETAS.forEach(c => {
        const st = statusAce(c);
        if (st === 'cancelada') return;
        const placa = parsePlaca(c.placa || c.veiculo || '');
        if (!placa) return;
        if (!byPlaca.has(placa)) byPlaca.set(placa, { placa, total: 0, feitas: 0, motorista: c.motorista || '' });
        const row = byPlaca.get(placa);
        row.total += 1;
        if (st === 'realizada') row.feitas += 1;
        if (!row.motorista && c.motorista) row.motorista = c.motorista;
      });
      return Array.from(byPlaca.values())
        .map(r => ({ ...r, pct: r.total ? Math.round((r.feitas / r.total) * 100) : 0 }))
        .sort((a, b) => a.pct - b.pct || b.total - a.total);
    }

    function buildUrgentes() {
      const out = [];
      COLETAS_50.forEach(c => {
        const sit = situacaoNorm50(c);
        if (!sit || sit === 'CANCELADA' || sit === 'COLETADA') return;
        const limite = parseLimite(c);
        if (!limite) return;
        const mins = minsUntil(limite);
        if (mins > JANELA_MIN) return;
        out.push({
          label: c.coleta || c.coleta_id || coletaKey(c),
          sit,
          limite,
          mins,
          veiculo: parsePlaca(c.veiculo || ''),
        });
      });
      out.sort((a, b) => a.mins - b.mins);
      return out;
    }

    function animateDonut(el, targetPct) {
      const arc = el.querySelector('.arc');
      const label = el.querySelector('.pct');
      if (!arc || !label) return;
      const full = arc.getAttribute('data-full') || '0 100';
      // sobe o % visualmente
      let start = 0;
      const end = Math.max(0, Math.min(100, targetPct || 0));
      const t0 = performance.now();
      const r = 15;
      const circ = 2 * Math.PI * r;
      function frame(t) {
        const k = Math.min(1, (t - t0) / PCT_ANIM_MS);
        const ease = 1 - Math.pow(1 - k, 3);
        const cur = Math.round(start + (end - start) * ease);
        const dash = (cur / 100) * circ;
        arc.setAttribute('stroke-dasharray', `${dash} ${circ - dash}`);
        label.textContent = cur + '%';
        if (k < 1) requestAnimationFrame(frame);
        else arc.setAttribute('stroke-dasharray', full);
      }
      requestAnimationFrame(frame);
    }

    function layoutPops(stack, nodes) {
      const gap = 10;
      let top = 0;
      nodes.forEach((node, i) => {
        node.style.top = top + 'px';
        node.style.zIndex = String(100 - i);
        top += node.offsetHeight + gap;
      });
    }

    function renderPlacaPops() {
      const stack = document.getElementById('placaStack');
      if (!PLACAS.length) {
        stack.innerHTML = '<div class="pop show" style="position:relative;opacity:.7;transform:none;"><div class="meta">Sem placas no período</div></div>';
        return;
      }
      const visible = [];
      const n = Math.min(PLACA_VISIBLE, PLACAS.length);
      for (let i = 0; i < n; i++) {
        visible.push(PLACAS[(placaCursor + i) % PLACAS.length]);
      }

      // remove pops antigos com saida
      Array.from(stack.querySelectorAll('.pop')).forEach(el => {
        el.classList.remove('show');
        el.classList.add('leaving');
        setTimeout(() => el.remove(), 480);
      });

      // cria novos
      setTimeout(() => {
        const nodes = visible.map(p => {
          const color = p.pct >= 100 ? '#22c55e' : p.pct >= 50 ? '#38bdf8' : '#f59e0b';
          const el = document.createElement('div');
          el.className = 'pop pop-placa';
          el.innerHTML = `
            <div class="donut">${donutSvg(p.pct, color)}<div class="pct">0%</div></div>
            <div>
              <div class="name">${esc(p.placa)}</div>
              <div class="meta">${p.feitas}/${p.total}${p.motorista ? ' · ' + esc(p.motorista.split(' ')[0]) : ''}</div>
            </div>
            <div class="badge">${p.pct}%</div>`;
          stack.appendChild(el);
          requestAnimationFrame(() => el.classList.add('show'));
          animateDonut(el, p.pct);
          return el;
        });
        layoutPops(stack, nodes);
      }, 120);
    }

    function renderPrazoPops() {
      const stack = document.getElementById('prazoStack');
      if (!URGENTES.length) {
        stack.innerHTML = '<div class="pop show" style="position:relative;opacity:.7;transform:none;"><div class="meta">Nada perto do limite agora</div></div>';
        return;
      }
      const visible = [];
      const n = Math.min(PRAZO_VISIBLE, URGENTES.length);
      for (let i = 0; i < n; i++) {
        visible.push(URGENTES[(prazoCursor + i) % URGENTES.length]);
      }

      Array.from(stack.querySelectorAll('.pop')).forEach(el => {
        el.classList.remove('show');
        el.classList.add('leaving');
        setTimeout(() => el.remove(), 480);
      });

      setTimeout(() => {
        const nodes = visible.map(r => {
          const atrasada = r.mins < 0;
          const tag = atrasada ? `-${Math.abs(r.mins)}m` : `${r.mins}m`;
          const el = document.createElement('div');
          el.className = 'pop pop-prazo' + (atrasada ? '' : ' warn');
          el.innerHTML = `
            <div class="hora">${pad(r.limite.getHours())}:${pad(r.limite.getMinutes())}</div>
            <div>
              <div class="name" style="font-size:14px;">${esc(r.label)}</div>
              <div class="meta">${esc(r.sit)}${r.veiculo ? ' · ' + esc(r.veiculo) : ''}</div>
            </div>
            <div class="tag">${esc(tag)}</div>`;
          stack.appendChild(el);
          requestAnimationFrame(() => el.classList.add('show'));
          return el;
        });
        layoutPops(stack, nodes);
      }, 120);
    }

    function startPopLoops() {
      if (placaTimer) clearInterval(placaTimer);
      if (prazoTimer) clearInterval(prazoTimer);
      renderPlacaPops();
      renderPrazoPops();
      placaTimer = setInterval(() => {
        if (!PLACAS.length) return;
        placaCursor = (placaCursor + 1) % PLACAS.length;
        renderPlacaPops();
      }, PLACA_TICK_MS);
      prazoTimer = setInterval(() => {
        if (!URGENTES.length) return;
        // se cabem todas, ainda “pisca” renovando; senao avanca
        if (URGENTES.length > PRAZO_VISIBLE) {
          prazoCursor = (prazoCursor + 1) % URGENTES.length;
        }
        renderPrazoPops();
      }, PRAZO_TICK_MS);
    }

    async function refresh() {
      const status = document.getElementById('statusLine');
      try {
        const [r103, r50] = await Promise.all([
          chamarPlanilha('coletas103').catch(() => null),
          chamarPlanilha('coletas').catch(() => ({ rows: [] })),
        ]);
        COLETAS_50 = uniqueRows((r50 && r50.rows) || []);
        if (r103 && r103.rows && r103.rows.length) {
          COLETAS = uniqueRows(r103.rows);
        } else {
          COLETAS = COLETAS_50.map(c => {
            const sit = situacaoNorm50(c);
            const map = {
              COLETADA: 'realizada', COMANDADA: 'em_rota',
              CADASTRADA: 'parado', CANCELADA: 'cancelada',
            };
            return {
              ...c,
              status_ace: map[sit] || 'outro',
              placa: parsePlaca(c.veiculo || ''),
              hora: c.situacao_atual_hora || '',
            };
          });
        }
        const counts = countByStatus(COLETAS);
        renderTorres(counts);
        PLACAS = buildPlacas();
        URGENTES = buildUrgentes();
        placaCursor = 0;
        prazoCursor = 0;
        startPopLoops();
        status.textContent =
          `Atualizado ${new Date().toLocaleTimeString('pt-BR')} · ${counts.total} coletas · ${PLACAS.length} placas · ${URGENTES.length} no limite`;
      } catch (err) {
        status.textContent = err.message;
        document.getElementById('totalSub').textContent = err.message;
      }
    }

    tickClock();
    setInterval(tickClock, 1000);
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
