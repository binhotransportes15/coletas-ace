<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BINHO · COLETA</title>
  <script src="config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #0c1220;
      --line: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --col: #22c55e;
      --com: #38bdf8;
      --cad: #f59e0b;
      --can: #ef4444;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1100px 520px at 8% -10%, #132038 0%, transparent 55%),
        radial-gradient(800px 420px at 100% 0%, #1a1020 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .board {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 14px 16px 18px;
      display: grid;
      gap: 12px;
    }

    /* Header */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, #0f172a, #0b1220);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 14px;
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand img { height: 48px; width: auto; display: block; object-fit: contain; }
    .brand .title {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #fff;
    }
    .clock-box { text-align: right; }
    .clock-box .lbl {
      color: var(--muted); font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .clock-box .time {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .clock-box .date { color: var(--muted); font-size: 11px; }

    /* Torres (destaque) */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .torres {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      min-height: 280px;
      padding: 4px 4px 0;
    }
    .torre {
      width: min(130px, 20vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      color: inherit;
    }
    .torre .pin {
      width: 32px; height: 32px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: grid; place-items: center;
      margin-bottom: 8px;
      box-shadow: 0 6px 14px rgba(0,0,0,.35);
    }
    .torre .pin span {
      transform: rotate(45deg);
      font-size: 10px; font-weight: 800; color: #fff;
    }
    .torre .barra {
      width: 100%;
      min-height: 48px;
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12px;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      transition: height .35s ease, filter .15s, transform .15s;
    }
    .torre .barra strong {
      font-size: clamp(20px, 2.8vw, 32px);
      font-weight: 300; color: #fff; line-height: 1;
    }
    .torre .faixa {
      width: 100%; padding: 7px 6px; color: #fff;
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase;
      clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
    }
    .torre .base {
      width: 100%; background: #0f172a;
      border: 1px solid var(--line); border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 8px 6px 10px; text-align: center;
    }
    .torre .base .qtd { font-size: 18px; font-weight: 700; display: block; }
    .torre .base .lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .torre:hover { transform: translateY(-3px); }
    .torre.active .barra { filter: brightness(1.12); }
    .torre.active .base { border-color: #67e8f9; }

    .t-col .pin, .t-col .barra { background: var(--col); }
    .t-col .faixa { background: #16a34a; }
    .t-col .base .qtd { color: var(--col); }
    .t-com .pin, .t-com .barra { background: var(--com); }
    .t-com .faixa { background: #0284c7; }
    .t-com .base .qtd { color: var(--com); }
    .t-cad .pin, .t-cad .barra { background: var(--cad); }
    .t-cad .faixa { background: #d97706; }
    .t-cad .base .qtd { color: var(--cad); }
    .t-can .pin, .t-can .barra { background: var(--can); }
    .t-can .faixa { background: #dc2626; }
    .t-can .base .qtd { color: var(--can); }

    /* Faixa compacta abaixo das torres */
    .ops {
      display: grid;
      grid-template-columns: 140px 1.2fr 1.4fr;
      gap: 10px;
      min-height: 0;
    }
    .mini {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .mini h3 {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 700;
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .total-num {
      font-size: 42px;
      font-weight: 200;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .total-sub { color: var(--muted); font-size: 11px; margin-top: 6px; }

    .placas-list, .urgentes-list {
      overflow: auto;
      max-height: 160px;
      display: grid;
      gap: 6px;
      min-height: 0;
    }
    .placa-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 8px;
      align-items: center;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 5px 8px;
    }
    .donut { width: 40px; height: 40px; position: relative; }
    .donut svg { width: 40px; height: 40px; transform: rotate(-90deg); }
    .donut .pct {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 9px; font-weight: 700; color: #fff;
    }
    .placa-meta .name { font-size: 13px; font-weight: 700; letter-spacing: 0.03em; }
    .placa-meta .detail { color: var(--muted); font-size: 10px; }
    .placa-pct { font-size: 12px; font-weight: 700; color: var(--col); }

    .urgente {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 8px;
      align-items: center;
      background: #020617;
      border: 1px solid #1e293b;
      border-left: 3px solid var(--cad);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
    }
    .urgente.atrasada { border-left-color: var(--can); }
    .urgente .limite { font-weight: 700; font-variant-numeric: tabular-nums; }
    .urgente .id { font-weight: 700; font-size: 12px; }
    .urgente .meta { color: var(--muted); font-size: 10px; }
    .urgente .tag {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      padding: 3px 6px; border-radius: 999px; background: #1e293b; color: var(--cad);
      white-space: nowrap;
    }
    .urgente.atrasada .tag { color: #fecaca; background: #450a0a; }

    .empty { color: var(--muted); font-size: 11px; padding: 10px 4px; text-align: center; }
    .status-line { color: var(--muted); font-size: 11px; padding: 0 2px; }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px;
    }
    .chip {
      background: #020617; border: 1px solid #334155; color: var(--text);
      border-radius: 999px; padding: 4px 10px; font-size: 11px; cursor: pointer;
    }
    .chip.active { border-color: #67e8f9; color: #67e8f9; }

    .lista { overflow: auto; max-height: 220px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid var(--line); padding: 7px 6px; text-align: left; }
    th { color: #67e8f9; font-weight: 600; }
    .sit { font-weight: 700; }
    .sit-COLETADA, .sit-realizada { color: var(--col); }
    .sit-COMANDADA, .sit-em_rota { color: var(--com); }
    .sit-CADASTRADA, .sit-parado { color: var(--cad); }
    .sit-CANCELADA, .sit-cancelada { color: var(--can); }
    .muted { color: var(--muted); font-size: 11px; }

    @media (max-width: 980px) {
      .ops { grid-template-columns: 1fr; }
      .torres { gap: 8px; min-height: 230px; }
      .torre { width: 22vw; }
      .topbar { grid-template-columns: 1fr; }
      .clock-box { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="board">
    <header class="topbar">
      <div class="brand">
        <img src="logo-binho.png" alt="BINHO Transportes" />
        <div class="title">COLETA</div>
      </div>
      <div class="clock-box">
        <div class="lbl">Tempo real</div>
        <div class="time" id="clock">--:--:--</div>
        <div class="date" id="clockDate">—</div>
      </div>
    </header>

    <section class="panel">
      <h2>Torres · tempo real</h2>
      <div class="torres" id="torres">
        <button type="button" class="torre t-col" data-filtro="realizada">
          <div class="pin"><span>01</span></div>
          <div class="barra" id="barReal"><strong id="nReal">0</strong></div>
          <div class="faixa">Realizada</div>
          <div class="base"><span class="qtd" id="qReal">0</span><div class="lbl">coletada</div></div>
        </button>
        <button type="button" class="torre t-com" data-filtro="em_rota">
          <div class="pin"><span>02</span></div>
          <div class="barra" id="barRota"><strong id="nRota">0</strong></div>
          <div class="faixa">Em rota</div>
          <div class="base"><span class="qtd" id="qRota">0</span><div class="lbl">comandada</div></div>
        </button>
        <button type="button" class="torre t-cad" data-filtro="parado">
          <div class="pin"><span>03</span></div>
          <div class="barra" id="barPar"><strong id="nPar">0</strong></div>
          <div class="faixa">Parado</div>
          <div class="base"><span class="qtd" id="qPar">0</span><div class="lbl">cadastrada</div></div>
        </button>
        <button type="button" class="torre t-can" data-filtro="cancelada">
          <div class="pin"><span>04</span></div>
          <div class="barra" id="barCan"><strong id="nCan">0</strong></div>
          <div class="faixa">Cancelada</div>
          <div class="base"><span class="qtd" id="qCan">0</span><div class="lbl">SPO</div></div>
        </button>
      </div>
    </section>

    <section class="ops">
      <div class="mini">
        <h3>Total</h3>
        <div class="total-num" id="totalColetas">0</div>
        <div class="total-sub" id="totalSub">coletas</div>
      </div>

      <div class="mini">
        <h3>Por placa</h3>
        <div class="placas-list" id="placasList"></div>
      </div>

      <div class="mini">
        <h3>Perto do limite</h3>
        <div class="urgentes-list" id="urgentesList"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Detalhe</h2>
      <div class="toolbar" id="filtros">
        <button type="button" class="chip active" data-filtro="TODAS">Todas</button>
        <button type="button" class="chip" data-filtro="realizada">Realizada</button>
        <button type="button" class="chip" data-filtro="em_rota">Em rota</button>
        <button type="button" class="chip" data-filtro="parado">Parado</button>
        <button type="button" class="chip" data-filtro="cancelada">Cancelada</button>
      </div>
      <div class="lista">
        <table>
          <thead>
            <tr>
              <th>Coleta</th>
              <th>Status</th>
              <th>Situação</th>
              <th>Hora</th>
              <th>Placa</th>
              <th>Motorista</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <p class="status-line" id="statusLine">BINHO · COLETA</p>
  </div>

  <script>
    const SCRIPT_URL = (window.ACE_CONFIG && window.ACE_CONFIG.scriptUrl) || '';
    const JANELA_MIN = 120;
    let COLETAS = [];
    let COLETAS_50 = [];
    let FILTRO = 'TODAS';

    function pad(n) { return String(n).padStart(2, '0'); }

    function tickClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
      document.getElementById('clockDate').textContent =
        `${dias[now.getDay()]} · ${pad(now.getDate())}/${pad(now.getMonth() + 1)}`;
    }

    async function chamarPlanilha(action, params = {}) {
      if (!SCRIPT_URL) throw new Error('Configure scriptUrl em config.js');
      const url = new URL(SCRIPT_URL);
      url.searchParams.set('action', action);
      url.searchParams.set('t', String(Date.now()));
      Object.entries(params).forEach(([k, v]) => {
        if (v != null && v !== '') url.searchParams.set(k, v);
      });
      const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      let dados;
      try { dados = JSON.parse(text); }
      catch { throw new Error('Apps Script inválido — publique Nova versão do Code.gs'); }
      if (!dados.ok) throw new Error(dados.error || 'Erro na planilha');
      return dados;
    }

    function coletaKey(r) {
      return String(r.coleta_id || r.coleta || `${r.unidade || ''}${r.numero || ''}`)
        .toUpperCase().replace(/\s+/g, '').trim();
    }

    function statusAce(c) {
      const raw = String(c.status_ace || '').toLowerCase().trim();
      if (['parado', 'em_rota', 'realizada', 'cancelada'].includes(raw)) return raw;
      const s = String(c.situacao_atual || '').toUpperCase();
      if (s.includes('CANCEL')) return 'cancelada';
      if (s.includes('COLET') || s.includes('REALIZ')) return 'realizada';
      if (s.includes('COMAND') || s.includes('ROTA')) return 'em_rota';
      if (s.includes('CADASTR') || s.includes('PARADO')) return 'parado';
      return 'outro';
    }

    function situacaoNorm50(c) {
      const s = String(c.situacao_atual || '').toUpperCase();
      if (s.includes('CANCEL')) return 'CANCELADA';
      if (s.includes('COLET')) return 'COLETADA';
      if (s.includes('COMAND')) return 'COMANDADA';
      if (s.includes('CADASTR')) return 'CADASTRADA';
      return '';
    }

    function uniqueRows(rows) {
      const map = new Map();
      (rows || []).forEach(r => {
        const key = coletaKey(r);
        if (!key) return;
        if (!map.has(key)) map.set(key, r);
      });
      return Array.from(map.values());
    }

    function parsePlaca(raw) {
      const text = String(raw || '').toUpperCase().trim();
      if (!text) return '';
      const m = text.match(/[A-Z]{3}\d[A-Z0-9]\d{2}|[A-Z]{3}\d{4}/);
      return m ? m[0] : text.split(/\s+/)[0];
    }

    function parseLimite(c) {
      const raw = String(c.data_hora_limite || '').trim();
      const now = new Date();
      let day = now.getDate(), month = now.getMonth() + 1, hour = 0, minute = 0, ok = false;
      let m = raw.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+(\d{1,2}):(\d{2})/);
      if (m) {
        day = +m[1]; month = +m[2]; hour = +m[4]; minute = +m[5]; ok = true;
      } else {
        const dOnly = String(c.data_limite_inicial || '').match(/(\d{1,2})\/(\d{1,2})/);
        const hOnly = raw.match(/(\d{1,2}):(\d{2})/) || String(c.hora || '').match(/(\d{1,2}):(\d{2})/);
        if (dOnly) { day = +dOnly[1]; month = +dOnly[2]; ok = true; }
        if (hOnly) { hour = +hOnly[1]; minute = +hOnly[2]; ok = true; }
      }
      if (!ok) return null;
      const year = now.getFullYear();
      const dt = new Date(year, month - 1, day, hour, minute, 0, 0);
      if (dt.getTime() - now.getTime() > 180 * 86400000) dt.setFullYear(year - 1);
      if (now.getTime() - dt.getTime() > 180 * 86400000) dt.setFullYear(year + 1);
      return dt;
    }

    function minsUntil(dt) {
      return Math.round((dt.getTime() - Date.now()) / 60000);
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function alturaTorre(valor, max) {
      const minH = 52, maxH = 190;
      if (!max || max <= 0) return minH;
      return Math.round(minH + (valor / max) * (maxH - minH));
    }

    function countByStatus(rows) {
      const out = { total: 0, parado: 0, em_rota: 0, realizada: 0, cancelada: 0, outro: 0 };
      rows.forEach(c => {
        const s = statusAce(c);
        out.total += 1;
        if (out[s] != null) out[s] += 1;
        else out.outro += 1;
      });
      return out;
    }

    function renderTorres(counts) {
      const max = Math.max(counts.realizada, counts.em_rota, counts.parado, counts.cancelada, 1);
      const map = [
        ['Real', 'barReal', counts.realizada],
        ['Rota', 'barRota', counts.em_rota],
        ['Par', 'barPar', counts.parado],
        ['Can', 'barCan', counts.cancelada],
      ];
      map.forEach(([suf, bar, val]) => {
        document.getElementById('n' + suf).textContent = val;
        document.getElementById('q' + suf).textContent = val;
        document.getElementById(bar).style.height = alturaTorre(val, max) + 'px';
      });
      document.getElementById('totalColetas').textContent = String(counts.total);
      document.getElementById('totalSub').textContent = 'coletas no período';
    }

    function donutSvg(pct, color) {
      const p = Math.max(0, Math.min(100, pct || 0));
      const r = 14;
      const c = 2 * Math.PI * r;
      const dash = (p / 100) * c;
      return `<svg viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="${r}" fill="none" stroke="#1e293b" stroke-width="5"></circle>
        <circle cx="18" cy="18" r="${r}" fill="none" stroke="${color}" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="${dash} ${c - dash}"></circle>
      </svg>`;
    }

    function renderPlacas() {
      const list = document.getElementById('placasList');
      const byPlaca = new Map();
      COLETAS.forEach(c => {
        const st = statusAce(c);
        if (st === 'cancelada') return;
        const placa = parsePlaca(c.placa || c.veiculo || '');
        if (!placa) return;
        if (!byPlaca.has(placa)) byPlaca.set(placa, { placa, total: 0, feitas: 0 });
        const row = byPlaca.get(placa);
        row.total += 1;
        if (st === 'realizada') row.feitas += 1;
      });
      const placas = Array.from(byPlaca.values())
        .map(r => ({ ...r, pct: r.total ? Math.round((r.feitas / r.total) * 100) : 0 }))
        .sort((a, b) => a.pct - b.pct || b.total - a.total)
        .slice(0, 12);
      if (!placas.length) {
        list.innerHTML = '<div class="empty">Sem placas</div>';
        return;
      }
      list.innerHTML = placas.map(p => {
        const color = p.pct >= 100 ? '#22c55e' : p.pct >= 50 ? '#38bdf8' : '#f59e0b';
        return `<div class="placa-row">
          <div class="donut">${donutSvg(p.pct, color)}<div class="pct">${p.pct}%</div></div>
          <div class="placa-meta">
            <div class="name">${esc(p.placa)}</div>
            <div class="detail">${p.feitas}/${p.total}</div>
          </div>
          <div class="placa-pct">${p.pct}%</div>
        </div>`;
      }).join('');
    }

    function renderUrgentes() {
      const list = document.getElementById('urgentesList');
      const rows = [];
      COLETAS_50.forEach(c => {
        const sit = situacaoNorm50(c);
        if (!sit || sit === 'CANCELADA' || sit === 'COLETADA') return;
        const limite = parseLimite(c);
        if (!limite) return;
        const mins = minsUntil(limite);
        if (mins > JANELA_MIN) return;
        rows.push({
          label: c.coleta || c.coleta_id || coletaKey(c),
          sit,
          limite,
          mins,
          veiculo: parsePlaca(c.veiculo || ''),
        });
      });
      rows.sort((a, b) => a.mins - b.mins);
      if (!rows.length) {
        list.innerHTML = '<div class="empty">Nada perto do limite</div>';
        return;
      }
      list.innerHTML = rows.slice(0, 20).map(r => {
        const atrasada = r.mins < 0;
        const tag = atrasada ? `-${Math.abs(r.mins)}m` : `${r.mins}m`;
        return `<div class="urgente${atrasada ? ' atrasada' : ''}">
          <div class="limite">${pad(r.limite.getHours())}:${pad(r.limite.getMinutes())}</div>
          <div>
            <div class="id">${esc(r.label)}</div>
            <div class="meta">${esc(r.sit)}${r.veiculo ? ' · ' + esc(r.veiculo) : ''}</div>
          </div>
          <div class="tag">${esc(tag)}</div>
        </div>`;
      }).join('');
    }

    function labelStatus(s) {
      return ({ parado: 'Parado', em_rota: 'Em rota', realizada: 'Realizada', cancelada: 'Cancelada' })[s] || s;
    }

    function setFiltro(filtro) {
      FILTRO = filtro || 'TODAS';
      document.querySelectorAll('.chip[data-filtro], .torre[data-filtro]').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-filtro') === FILTRO);
      });
      renderTabela();
    }

    function renderTabela() {
      const tbody = document.getElementById('tbody');
      const lista = (FILTRO === 'TODAS' ? COLETAS : COLETAS.filter(c => statusAce(c) === FILTRO))
        .slice().reverse().slice(0, 250);
      if (!lista.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">Nenhuma coleta.</td></tr>';
        return;
      }
      tbody.innerHTML = lista.map(c => {
        const st = statusAce(c);
        return `<tr>
          <td>${esc(c.coleta_id || '')}</td>
          <td class="sit sit-${esc(st)}">${esc(labelStatus(st))}</td>
          <td>${esc(c.situacao_atual || '')}</td>
          <td>${esc(String(c.hora || '').slice(0, 5))}</td>
          <td>${esc(c.placa || '')}</td>
          <td>${esc(c.motorista || '')}</td>
        </tr>`;
      }).join('');
    }

    async function refresh() {
      const status = document.getElementById('statusLine');
      try {
        const [r103, r50] = await Promise.all([
          chamarPlanilha('coletas103').catch(() => null),
          chamarPlanilha('coletas').catch(() => ({ rows: [] })),
        ]);
        COLETAS_50 = uniqueRows((r50 && r50.rows) || []);
        if (r103 && r103.rows && r103.rows.length) {
          COLETAS = uniqueRows(r103.rows);
        } else {
          // fallback: mapeia 50 para status ACE
          COLETAS = COLETAS_50.map(c => {
            const sit = situacaoNorm50(c);
            const map = {
              COLETADA: 'realizada',
              COMANDADA: 'em_rota',
              CADASTRADA: 'parado',
              CANCELADA: 'cancelada',
            };
            return {
              ...c,
              status_ace: map[sit] || 'outro',
              placa: parsePlaca(c.veiculo || ''),
              hora: c.situacao_atual_hora || '',
            };
          });
        }
        const counts = countByStatus(COLETAS);
        renderTorres(counts);
        renderPlacas();
        renderUrgentes();
        renderTabela();
        status.textContent = `Atualizado ${new Date().toLocaleTimeString('pt-BR')} · ${counts.total} coletas`;
      } catch (err) {
        status.textContent = err.message;
        document.getElementById('totalSub').textContent = err.message;
      }
    }

    document.querySelectorAll('.chip[data-filtro], .torre[data-filtro]').forEach(el => {
      el.addEventListener('click', () => setFiltro(el.getAttribute('data-filtro')));
    });

    tickClock();
    setInterval(tickClock, 1000);
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
