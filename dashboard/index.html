<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BINHO · COLETA</title>
  <script src="config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #0c1220;
      --line: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --accent: #38bdf8;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1200px 600px at 10% -10%, #132038 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1a1020 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .board {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 18px 20px 24px;
      display: grid;
      gap: 16px;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      background: linear-gradient(180deg, #0f172a, #0b1220);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }
    .brand img {
      height: 64px;
      width: auto;
      display: block;
      object-fit: contain;
    }
    .brand .title {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #fff;
      line-height: 1;
    }
    .brand .title span {
      color: var(--accent);
      font-weight: 300;
      letter-spacing: 0.08em;
    }
    .clock-box {
      text-align: right;
      padding: 4px 8px;
    }
    .clock-box .lbl {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .clock-box .time {
      font-size: clamp(34px, 5vw, 48px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: #f8fafc;
    }
    .clock-box .date {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    /* ===== MAIN GRID ===== */
    .main {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 16px;
      min-height: 0;
    }
    .col {
      display: grid;
      gap: 16px;
      min-height: 0;
      grid-template-rows: auto 1fr;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,.25);
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 700;
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .total-panel {
      align-items: flex-start;
      justify-content: center;
      min-height: 150px;
    }
    .total-num {
      font-size: clamp(64px, 10vw, 96px);
      font-weight: 200;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: #fff;
    }
    .total-sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    .total-split {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .pill {
      border: 1px solid #334155;
      background: #020617;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .pill b { color: var(--text); font-weight: 700; }
    .pill.ok b { color: var(--ok); }
    .pill.warn b { color: var(--warn); }
    .pill.info b { color: var(--accent); }
    .pill.bad b { color: var(--danger); }

    .placas-panel { overflow: hidden; }
    .placas-list {
      overflow: auto;
      display: grid;
      gap: 10px;
      padding-right: 4px;
      min-height: 0;
    }
    .placa-row {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 14px;
      align-items: center;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .donut {
      width: 64px;
      height: 64px;
      position: relative;
    }
    .donut svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .donut .pct {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .placa-meta .name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .placa-meta .detail {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .placa-bar {
      width: 110px;
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .placa-bar > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #16a34a, #4ade80);
      border-radius: 999px;
    }

    .urgentes-panel { overflow: hidden; }
    .urgentes-list {
      overflow: auto;
      display: grid;
      gap: 8px;
      min-height: 0;
    }
    .urgente {
      display: grid;
      grid-template-columns: 78px 1fr auto;
      gap: 10px;
      align-items: center;
      background: #020617;
      border: 1px solid #1e293b;
      border-left: 4px solid var(--warn);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .urgente.atrasada { border-left-color: var(--danger); }
    .urgente .limite {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }
    .urgente .id { font-weight: 700; }
    .urgente .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .urgente .tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: var(--warn);
      white-space: nowrap;
    }
    .urgente.atrasada .tag { color: #fecaca; background: #450a0a; }

    .status-line {
      color: var(--muted);
      font-size: 12px;
      padding: 0 4px;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 18px 8px;
      text-align: center;
    }

    @media (max-width: 980px) {
      .main { grid-template-columns: 1fr; }
      .brand img { height: 48px; }
      .topbar { grid-template-columns: 1fr; }
      .clock-box { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="board">
    <header class="topbar">
      <div class="brand">
        <img src="logo-binho.png" alt="BINHO Transportes" />
        <div class="title">COLETA</div>
      </div>
      <div class="clock-box">
        <div class="lbl">Tempo real</div>
        <div class="time" id="clock">--:--:--</div>
        <div class="date" id="clockDate">—</div>
      </div>
    </header>

    <div class="main">
      <div class="col">
        <section class="panel total-panel">
          <h2>Total de coletas</h2>
          <div class="total-num" id="totalColetas">0</div>
          <div class="total-sub" id="totalSub">Carregando planilha…</div>
          <div class="total-split" id="totalPills"></div>
        </section>

        <section class="panel placas-panel">
          <h2>Progresso por placa</h2>
          <div class="placas-list" id="placasList"></div>
        </section>
      </div>

      <div class="col">
        <section class="panel" style="min-height:150px; justify-content:center;">
          <h2>Janela de atenção</h2>
          <div class="total-sub" id="janelaInfo">
            Coletas perto do horário limite · não coletadas · sem canceladas
          </div>
          <div class="total-split" style="margin-top:12px;">
            <span class="pill warn"><b id="qtdUrgentes">0</b> próximas / atrasadas</span>
            <span class="pill info"><b id="janelaHoras">2h</b> de folga</span>
          </div>
        </section>

        <section class="panel urgentes-panel">
          <h2>Perto do limite</h2>
          <div class="urgentes-list" id="urgentesList"></div>
        </section>
      </div>
    </div>

    <p class="status-line" id="statusLine">BINHO · COLETA</p>
  </div>

  <script>
    const SCRIPT_URL = (window.ACE_CONFIG && window.ACE_CONFIG.scriptUrl) || '';
    const JANELA_MIN = 120; // minutos antes do limite = "perto"
    let COLETAS_50 = [];
    let COLETAS_103 = [];

    function pad(n) { return String(n).padStart(2, '0'); }

    function tickClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
      document.getElementById('clockDate').textContent =
        `${dias[now.getDay()]} · ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
    }

    async function chamarPlanilha(action, params = {}) {
      if (!SCRIPT_URL) throw new Error('Configure scriptUrl em config.js');
      const url = new URL(SCRIPT_URL);
      url.searchParams.set('action', action);
      url.searchParams.set('t', String(Date.now()));
      Object.entries(params).forEach(([k, v]) => {
        if (v != null && v !== '') url.searchParams.set(k, v);
      });
      const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      let dados;
      try { dados = JSON.parse(text); }
      catch { throw new Error('Apps Script inválido — publique Nova versão do Code.gs'); }
      if (!dados.ok) throw new Error(dados.error || 'Erro na planilha');
      return dados;
    }

    function coletaKey(r) {
      return String(r.coleta_id || r.coleta || `${r.unidade || ''}${r.numero || ''}`)
        .toUpperCase().replace(/\s+/g, '').trim();
    }

    function situacaoNorm(c) {
      const s = String(c.situacao_atual || c.status_ace || '').toUpperCase();
      if (s.includes('CANCEL')) return 'CANCELADA';
      if (s.includes('COLET') || s.includes('REALIZ')) return 'COLETADA';
      if (s.includes('COMAND') || s.includes('ROTA') || s.includes('EM_ROTA')) return 'COMANDADA';
      if (s.includes('CADASTR') || s.includes('PARADO')) return 'CADASTRADA';
      return '';
    }

    function uniqueRows(rows) {
      const map = new Map();
      (rows || []).forEach(r => {
        const key = coletaKey(r);
        if (!key) return;
        if (!map.has(key)) map.set(key, r);
      });
      return Array.from(map.values());
    }

    function parsePlaca(raw) {
      const text = String(raw || '').toUpperCase().trim();
      if (!text) return '';
      const m = text.match(/[A-Z]{3}\d[A-Z0-9]\d{2}|[A-Z]{3}\d{4}/);
      return m ? m[0] : text.split(/\s+/)[0];
    }

    function parseLimite(c) {
      // Prefer data_hora_limite "29/07 17:00" ou data_limite_inicial + hora do texto
      const raw = String(c.data_hora_limite || '').trim();
      const now = new Date();
      let day = now.getDate(), month = now.getMonth() + 1, hour = 0, minute = 0;
      let ok = false;
      let m = raw.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+(\d{1,2}):(\d{2})/);
      if (m) {
        day = +m[1]; month = +m[2]; hour = +m[4]; minute = +m[5]; ok = true;
      } else {
        const dOnly = String(c.data_limite_inicial || '').match(/(\d{1,2})\/(\d{1,2})/);
        const hOnly = raw.match(/(\d{1,2}):(\d{2})/) || String(c.hora || '').match(/(\d{1,2}):(\d{2})/);
        if (dOnly) { day = +dOnly[1]; month = +dOnly[2]; ok = true; }
        if (hOnly) { hour = +hOnly[1]; minute = +hOnly[2]; ok = true; }
      }
      if (!ok) return null;
      const year = now.getFullYear();
      const dt = new Date(year, month - 1, day, hour, minute, 0, 0);
      // Se limite ficou > 6 meses no futuro (virada de ano), ajusta
      if (dt.getTime() - now.getTime() > 180 * 86400000) dt.setFullYear(year - 1);
      if (now.getTime() - dt.getTime() > 180 * 86400000) dt.setFullYear(year + 1);
      return dt;
    }

    function minsUntil(dt) {
      return Math.round((dt.getTime() - Date.now()) / 60000);
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function donutSvg(pct, color) {
      const p = Math.max(0, Math.min(100, pct || 0));
      const r = 22;
      const c = 2 * Math.PI * r;
      const dash = (p / 100) * c;
      return `<svg viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="${r}" fill="none" stroke="#1e293b" stroke-width="7"></circle>
        <circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="${dash} ${c - dash}"></circle>
      </svg>`;
    }

    function renderTotais(rows) {
      const total = rows.length;
      let col = 0, com = 0, cad = 0, can = 0;
      rows.forEach(r => {
        const s = situacaoNorm(r);
        if (s === 'COLETADA') col += 1;
        else if (s === 'COMANDADA') com += 1;
        else if (s === 'CADASTRADA') cad += 1;
        else if (s === 'CANCELADA') can += 1;
      });
      document.getElementById('totalColetas').textContent = String(total);
      document.getElementById('totalSub').textContent = 'Coletas no período atual (planilha)';
      document.getElementById('totalPills').innerHTML = `
        <span class="pill ok"><b>${col}</b> realizadas</span>
        <span class="pill info"><b>${com}</b> em rota</span>
        <span class="pill warn"><b>${cad}</b> paradas</span>
        <span class="pill bad"><b>${can}</b> canceladas</span>`;
    }

    function buildPlacas() {
      // Prefer 103 (placa explícita); fallback veiculo da 50
      const byPlaca = new Map();
      const source = COLETAS_103.length ? COLETAS_103 : COLETAS_50;
      source.forEach(c => {
        const sit = situacaoNorm(c);
        if (sit === 'CANCELADA') return;
        const placa = parsePlaca(c.placa || c.veiculo || '');
        if (!placa) return;
        if (!byPlaca.has(placa)) {
          byPlaca.set(placa, { placa, total: 0, feitas: 0, motorista: c.motorista || '' });
        }
        const row = byPlaca.get(placa);
        row.total += 1;
        if (sit === 'COLETADA') row.feitas += 1;
        if (!row.motorista && c.motorista) row.motorista = c.motorista;
      });
      return Array.from(byPlaca.values())
        .map(r => ({ ...r, pct: r.total ? Math.round((r.feitas / r.total) * 100) : 0 }))
        .sort((a, b) => a.pct - b.pct || b.total - a.total);
    }

    function renderPlacas() {
      const list = document.getElementById('placasList');
      const placas = buildPlacas();
      if (!placas.length) {
        list.innerHTML = '<div class="empty">Sem placas no período (rode o 103 ou aguarde sync).</div>';
        return;
      }
      list.innerHTML = placas.map(p => {
        const color = p.pct >= 100 ? '#22c55e' : p.pct >= 50 ? '#38bdf8' : '#f59e0b';
        return `<div class="placa-row">
          <div class="donut">${donutSvg(p.pct, color)}<div class="pct">${p.pct}%</div></div>
          <div class="placa-meta">
            <div class="name">${esc(p.placa)}</div>
            <div class="detail">${p.feitas}/${p.total} feitas${p.motorista ? ' · ' + esc(p.motorista) : ''}</div>
          </div>
          <div class="placa-bar"><i style="width:${p.pct}%"></i></div>
        </div>`;
      }).join('');
    }

    function buildUrgentes() {
      const out = [];
      COLETAS_50.forEach(c => {
        const sit = situacaoNorm(c);
        if (!sit || sit === 'CANCELADA' || sit === 'COLETADA') return;
        const limite = parseLimite(c);
        if (!limite) return;
        const mins = minsUntil(limite);
        // Perto: até JANELA_MIN à frente, ou já atrasada (ainda aberta)
        if (mins > JANELA_MIN) return;
        out.push({
          id: coletaKey(c),
          label: c.coleta || c.coleta_id || coletaKey(c),
          sit,
          limite,
          mins,
          motorista: c.motorista || '',
          veiculo: parsePlaca(c.veiculo || c.placa || ''),
          destino: c.dest_cidade || c.dest || '',
        });
      });
      out.sort((a, b) => a.mins - b.mins);
      return out;
    }

    function fmtHora(dt) {
      return `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    }

    function renderUrgentes() {
      const list = document.getElementById('urgentesList');
      const rows = buildUrgentes();
      document.getElementById('qtdUrgentes').textContent = String(rows.length);
      if (!rows.length) {
        list.innerHTML = '<div class="empty">Nenhuma coleta perto do limite agora.</div>';
        return;
      }
      list.innerHTML = rows.map(r => {
        const atrasada = r.mins < 0;
        const tag = atrasada
          ? `Atrasada ${Math.abs(r.mins)} min`
          : r.mins <= 30 ? `Em ${r.mins} min` : `Em ${r.mins} min`;
        return `<div class="urgente${atrasada ? ' atrasada' : ''}">
          <div class="limite">${fmtHora(r.limite)}</div>
          <div>
            <div class="id">${esc(r.label)}</div>
            <div class="meta">${esc(r.sit)}${r.veiculo ? ' · ' + esc(r.veiculo) : ''}${r.destino ? ' · ' + esc(r.destino) : ''}</div>
          </div>
          <div class="tag">${esc(tag)}</div>
        </div>`;
      }).join('');
    }

    async function refresh() {
      const status = document.getElementById('statusLine');
      try {
        const [r50, r103] = await Promise.all([
          chamarPlanilha('coletas'),
          chamarPlanilha('coletas103').catch(() => ({ rows: [] })),
        ]);
        COLETAS_50 = uniqueRows(r50.rows || []);
        COLETAS_103 = uniqueRows(r103.rows || []);
        // Total = prefer 103 se existir, senão 50
        const base = COLETAS_103.length ? COLETAS_103 : COLETAS_50;
        renderTotais(base);
        renderPlacas();
        renderUrgentes();
        const when = new Date().toLocaleTimeString('pt-BR');
        status.textContent = `Atualizado ${when} · 50: ${COLETAS_50.length} · 103: ${COLETAS_103.length}`;
      } catch (err) {
        status.textContent = err.message;
        document.getElementById('totalSub').textContent = err.message;
      }
    }

    tickClock();
    setInterval(tickClock, 1000);
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
