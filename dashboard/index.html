<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BINHO · COLETA</title>
  <script src="config.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #0b1220;
      --line: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      /* Cores dos quadrados BINHO */
      --col: #8cc63f;
      --col-dark: #009245;
      --com: #29abe2;
      --com-dark: #1b1464;
      --cad: #fff200;
      --cad-dark: #fbb03b;
      --can: #ed1c24;
      --can-dark: #c1272d;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1100px 520px at 8% -10%, #132038 0%, transparent 55%),
        radial-gradient(800px 420px at 100% 0%, #1a1020 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    body.live-mode { overflow: hidden; height: 100vh; }

    .board {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 12px 14px 16px;
      display: grid;
      gap: 10px;
    }
    body.live-mode .board {
      height: 100vh;
      grid-template-rows: auto auto 1fr auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, #0f172a, #0b1220);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 14px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { height: 46px; width: auto; display: block; object-fit: contain; }
    .brand .title {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .nav {
      display: flex; gap: 6px;
    }
    .nav-btn {
      background: #020617; border: 1px solid #1e293b; color: #94a3b8;
      border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 700;
      cursor: pointer;
    }
    .nav-btn.active { color: #67e8f9; border-color: #334155; background: #0f172a; }
    .clock-box { text-align: right; }
    .clock-box .lbl {
      color: var(--muted); font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .clock-box .time {
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }
    .clock-box .date { color: var(--muted); font-size: 11px; }

    .view { display: none; }
    .view.active { display: grid; gap: 10px; min-height: 0; }
    body.live-mode #viewLive.active { height: 100%; grid-template-rows: 1fr; }

    .arena {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px 18px;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr;
      gap: 0;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.28);
    }
    .arena > h2 { display: none; }
    .panel h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .arena-body {
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      gap: 16px;
      min-height: 0;
      height: 100%;
    }
    .col-left, .col-right, .col-center {
      min-height: 0; min-width: 0;
      display: flex; flex-direction: column;
    }

    .total-hero {
      position: relative;
      border-radius: 18px;
      padding: 16px 14px 14px;
      margin-bottom: 12px;
      background:
        radial-gradient(120% 90% at 10% 0%, rgba(140,198,63,.22), transparent 55%),
        radial-gradient(90% 80% at 100% 100%, rgba(41,171,226,.16), transparent 50%),
        linear-gradient(160deg, #0f172a 0%, #020617 100%);
      border: 1px solid #243044;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 28px rgba(0,0,0,.35);
      overflow: hidden;
      flex-shrink: 0;
    }
    .total-hero::before {
      content: "";
      position: absolute; inset: 0 auto 0 0; width: 4px;
      background: linear-gradient(180deg, var(--col), var(--com), var(--cad), var(--can));
    }
    .total-lbl {
      display: block;
      font-size: 11px; font-weight: 800; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.16em;
      margin: 0 0 4px 6px;
    }
    .total-num {
      display: block;
      font-size: clamp(52px, 7vw, 72px);
      font-weight: 200;
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: #fff;
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .total-sub { display: none; }
    .total-mix {
      display: flex;
      gap: 3px;
      margin: 14px 0 0;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: #0b1220;
    }
    .total-mix span {
      display: block; height: 100%; min-width: 2px;
      transition: flex-grow .45s ease, flex-basis .45s ease;
      border-radius: 999px;
    }
    .total-mix .m-real { background: var(--col); }
    .total-mix .m-rota { background: var(--com); }
    .total-mix .m-par { background: var(--cad); }
    .total-mix .m-can { background: var(--can); }
    .total-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 10px;
      margin-top: 12px;
    }
    .total-stats div {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 6px; font-size: 11px; color: #94a3b8;
    }
    .total-stats b {
      font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .total-stats .s-real b { color: var(--col); }
    .total-stats .s-rota b { color: var(--com); }
    .total-stats .s-par b { color: var(--cad-dark); }
    .total-stats .s-can b { color: var(--can); }

    .pop-stack { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .pop {
      position: absolute; left: 0; right: 0;
      display: grid; align-items: center; gap: 10px;
      background: #020617; border: 1px solid #1e293b; border-radius: 12px;
      padding: 10px 12px; box-shadow: 0 10px 24px rgba(0,0,0,.35);
      opacity: 0; transform: translateY(24px) scale(0.96);
      transition: opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1), top .55s cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }
    .pop.show { opacity: 1; transform: translateY(0) scale(1); }
    .pop.leaving { opacity: 0; transform: translateY(-30px) scale(0.96); }
    .pop-placa { grid-template-columns: 46px 1fr auto; }
    .pop-prazo { grid-template-columns: 54px 1fr auto; border-left: 4px solid var(--can); }
    .pop-prazo.warn { border-left-color: var(--cad); }
    .donut { width: 42px; height: 42px; position: relative; }
    .donut svg { width: 42px; height: 42px; transform: rotate(-90deg); }
    .donut .pct {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 10px; font-weight: 800; color: #fff;
    }
    .pop .name { font-size: 14px; font-weight: 800; letter-spacing: 0.03em; }
    .pop .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .pop .badge { font-size: 13px; font-weight: 800; color: var(--col); }
    .pop-prazo .hora { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .pop-prazo .tag {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      padding: 4px 7px; border-radius: 999px; background: #450a0a; color: #fecaca;
    }
    .pop-prazo.warn .tag { background: #1e293b; color: var(--cad); }
    .pop-prazo.perdida .tag {
      background: #7f1d1d; color: #fff; letter-spacing: 0.04em;
      font-size: 11px; padding: 5px 8px;
    }

    .torres {
      flex: 1; display: flex; align-items: flex-end; justify-content: center;
      gap: 16px; min-height: 0; padding: 4px 4px 0;
    }
    .torre {
      width: min(128px, 17vw); display: flex; flex-direction: column; align-items: center;
      border: none; background: transparent; padding: 0; color: inherit;
    }
    .torre .pin {
      width: 36px; height: 36px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); display: grid; place-items: center;
      margin-bottom: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.4);
      border: 2px solid rgba(255,255,255,.25);
    }
    .torre .pin span { transform: rotate(45deg); font-size: 14px; font-weight: 800; color: #fff; }
    .torre .barra {
      width: 100%; min-height: 56px; border-radius: 8px 8px 0 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 22px rgba(0,0,0,.4); transition: height .45s ease;
      position: relative;
    }
    .torre .barra::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
      background: rgba(0,0,0,.22);
      clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
    }
    .torre .barra strong {
      font-size: clamp(20px, 2.8vw, 32px); font-weight: 700; color: #fff;
      line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.35);
      position: relative; z-index: 1;
    }
    .torre .barra strong .pct-sign {
      font-size: .55em; font-weight: 600; margin-left: 1px; opacity: .95;
    }
    .torre .base {
      width: 100%; background: #0f172a; border: 1px solid var(--line); border-top: none;
      border-radius: 0 0 10px 10px; padding: 10px 6px 12px; text-align: center;
    }
    .torre .base .lbl {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: var(--muted);
    }
    .t-col .pin, .t-col .barra {
      background: linear-gradient(145deg, var(--col) 0%, var(--col-dark) 100%);
    }
    .t-col .base .lbl { color: var(--col); }
    .t-com .pin, .t-com .barra {
      background: linear-gradient(145deg, var(--com) 0%, var(--com-dark) 100%);
    }
    .t-com .base .lbl { color: var(--com); }
    .t-cad .pin, .t-cad .barra {
      background: linear-gradient(145deg, var(--cad) 0%, var(--cad-dark) 100%);
    }
    .t-cad .pin span, .t-cad .barra strong { color: #1a1a1a; text-shadow: none; }
    .t-cad .base .lbl { color: var(--cad-dark); }
    .t-can .pin, .t-can .barra {
      background: linear-gradient(145deg, var(--can) 0%, var(--can-dark) 100%);
    }
    .t-can .base .lbl { color: var(--can); }

    /* Gestão */
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px;
    }
    .chip {
      background: #020617; border: 1px solid #334155; color: var(--text);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    .chip.active { border-color: #67e8f9; color: #67e8f9; }
    .search {
      display: flex; gap: 8px; align-items: center; margin-left: auto;
    }
    .search input {
      background: #020617; border: 1px solid #334155; color: var(--text);
      border-radius: 8px; padding: 7px 10px; min-width: 180px; font-size: 13px;
    }
    .btn {
      background: #164e63; border: 1px solid #22d3ee; color: #ecfeff;
      border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    .btn:hover { background: #155e75; }
    .btn:disabled { opacity: .5; cursor: wait; }
    .lista { overflow: auto; max-height: 520px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 7px; text-align: left; }
    th { color: #67e8f9; font-weight: 600; }
    .sit { font-weight: 700; }
    .sit-COLETADA, .sit-realizada { color: var(--col); }
    .sit-COMANDADA, .sit-em_rota { color: var(--com); }
    .sit-CADASTRADA, .sit-parado { color: var(--cad); }
    .sit-CANCELADA, .sit-cancelada { color: var(--can); }
    .muted { color: var(--muted); font-size: 12px; }
    .status-line { color: var(--muted); font-size: 11px; padding: 0 4px; }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, .72);
      align-items: center; justify-content: center; z-index: 50; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(1100px, 100%); max-height: 90vh; overflow: auto;
      background: #f3f4f6; border-radius: 10px; padding: 14px 16px 18px; color: #0f172a;
    }
    .modal h2 { margin: 0 0 2px; font-size: 17px; color: #0f172a; text-transform: none; letter-spacing: 0; }
    .modal .sub-hist { color: #64748b; font-size: 12px; margin: 0 0 12px; }
    .modal .close {
      float: right; background: #1e3a5f; border: none; color: #fff;
      border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px;
    }
    .ssw-wrap { overflow: auto; border: 1px solid #cbd5e1; border-radius: 4px; }
    .ssw-hist { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; }
    .ssw-hist thead th {
      background: #1e3a5f; color: #fff; font-weight: 600; padding: 8px 7px;
      text-align: left; white-space: nowrap;
    }
    .ssw-hist tbody td {
      padding: 7px; border-bottom: 1px solid #e2e8f0; vertical-align: top; color: #0f172a;
    }
    .ssw-hist tbody tr:nth-child(even) { background: #f1f5f9; }
    .ssw-hist .user { color: #1d4ed8; font-weight: 600; }
    .ssw-hist .instr { min-width: 260px; line-height: 1.35; }
    .ssw-hist .ctr { text-align: center; }

    @media (max-width: 980px) {
      body.live-mode:not(.tv-mode) { overflow: auto; height: auto; }
      body.live-mode:not(.tv-mode) .arena-body { grid-template-columns: 1fr; height: auto; }
      body.live-mode:not(.tv-mode) .pop-stack { min-height: 200px; }
      body.live-mode:not(.tv-mode) .torres { min-height: 280px; }
      body.live-mode:not(.tv-mode) .topbar { grid-template-columns: 1fr; }
      .search { margin-left: 0; width: 100%; }
      .search input { flex: 1; }
    }

    /* ===== MODO TV / TELA INTEIRA ===== */
    body.tv-mode {
      overflow: hidden !important;
      height: 100dvh !important;
      width: 100vw;
      background: #05080f;
    }
    body.tv-mode.tv-idle { cursor: none; }
    body.tv-mode .board {
      width: 100%;
      max-width: none;
      height: 100dvh;
      margin: 0;
      padding: clamp(10px, 1.4vmin, 28px);
      gap: clamp(8px, 1vmin, 16px);
      grid-template-rows: auto 1fr;
    }
    body.tv-mode .status-line,
    body.tv-mode #viewGestao,
    body.tv-mode .nav-btn[data-view="gestao"],
    body.tv-mode .arena > h2 {
      display: none !important;
    }
    body.tv-mode .topbar {
      padding: clamp(6px, 1vmin, 14px) clamp(12px, 1.6vmin, 22px);
      border-radius: clamp(10px, 1.2vmin, 18px);
      grid-template-columns: 1fr auto auto;
    }
    body.tv-mode .brand img { height: clamp(40px, 5.5vmin, 72px); }
    body.tv-mode .brand .title {
      font-size: clamp(26px, 3.6vmin, 48px);
      letter-spacing: 0.14em;
    }
    body.tv-mode .clock-box .lbl { font-size: clamp(10px, 1.1vmin, 14px); }
    body.tv-mode .clock-box .time {
      font-size: clamp(28px, 4vmin, 52px);
    }
    body.tv-mode .clock-box .date { font-size: clamp(12px, 1.4vmin, 18px); }
    body.tv-mode #viewLive.active {
      height: 100%;
      min-height: 0;
    }
    body.tv-mode .arena {
      border-radius: clamp(12px, 1.4vmin, 22px);
      padding: clamp(12px, 1.6vmin, 28px);
      height: 100%;
    }
    body.tv-mode .arena-body {
      grid-template-columns: minmax(160px, 18vw) 1fr minmax(200px, 24vw);
      gap: clamp(12px, 1.8vmin, 28px);
      height: 100%;
    }
    body.tv-mode .total-hero {
      padding: clamp(14px, 1.8vmin, 24px);
      margin-bottom: clamp(10px, 1.4vmin, 18px);
      border-radius: clamp(14px, 1.6vmin, 22px);
    }
    body.tv-mode .total-lbl { font-size: clamp(11px, 1.3vmin, 16px); }
    body.tv-mode .total-num {
      font-size: clamp(56px, 9vmin, 132px);
    }
    body.tv-mode .total-stats div { font-size: clamp(11px, 1.3vmin, 16px); }
    body.tv-mode .total-stats b { font-size: clamp(14px, 1.8vmin, 22px); }
    body.tv-mode .total-mix { height: clamp(6px, 0.8vmin, 10px); margin-top: clamp(12px, 1.5vmin, 18px); }
    body.tv-mode .torres {
      gap: clamp(14px, 2.2vmin, 36px);
      padding-bottom: clamp(4px, 0.6vmin, 10px);
    }
    body.tv-mode .torre {
      width: clamp(100px, 14vmin, 240px);
    }
    body.tv-mode .torre .pin {
      width: clamp(34px, 4.2vmin, 56px);
      height: clamp(34px, 4.2vmin, 56px);
      margin-bottom: clamp(10px, 1.4vmin, 18px);
    }
    body.tv-mode .torre .pin span { font-size: clamp(14px, 1.8vmin, 22px); }
    body.tv-mode .torre .barra {
      min-height: clamp(64px, 8vmin, 120px);
      border-radius: clamp(8px, 1vmin, 14px) clamp(8px, 1vmin, 14px) 0 0;
    }
    body.tv-mode .torre .barra strong {
      font-size: clamp(28px, 4.2vmin, 64px);
    }
    body.tv-mode .torre .base {
      padding: clamp(10px, 1.2vmin, 16px) 6px;
      border-radius: 0 0 clamp(8px, 1vmin, 14px) clamp(8px, 1vmin, 14px);
    }
    body.tv-mode .torre .base .lbl {
      font-size: clamp(12px, 1.5vmin, 20px);
    }
    body.tv-mode .pop {
      padding: clamp(10px, 1.2vmin, 16px) clamp(12px, 1.4vmin, 18px);
      border-radius: clamp(10px, 1.2vmin, 16px);
    }
    body.tv-mode .pop .name { font-size: clamp(14px, 1.8vmin, 22px); }
    body.tv-mode .pop .meta { font-size: clamp(11px, 1.3vmin, 16px); }
    body.tv-mode .pop .badge { font-size: clamp(13px, 1.6vmin, 20px); }
    body.tv-mode .pop-prazo .hora { font-size: clamp(16px, 2.2vmin, 28px); }
    body.tv-mode .donut,
    body.tv-mode .donut svg {
      width: clamp(42px, 5vmin, 64px);
      height: clamp(42px, 5vmin, 64px);
    }
    body.tv-mode .donut .pct { font-size: clamp(10px, 1.2vmin, 14px); }

    .nav-btn.tv-btn {
      border-color: #334155;
      color: #fbbf24;
    }
    body.tv-mode .nav-btn.tv-btn {
      color: #86efac;
      border-color: #166534;
      background: #052e16;
    }
    .tv-hint {
      position: fixed;
      left: 50%;
      bottom: clamp(12px, 2vmin, 28px);
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(2, 6, 23, .82);
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: clamp(11px, 1.3vmin, 15px);
      padding: 8px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease;
      white-space: nowrap;
    }
    body.tv-mode .tv-hint.show { opacity: 1; }

    @media (orientation: portrait) {
      body.tv-mode .arena-body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
      }
      body.tv-mode .col-left,
      body.tv-mode .col-right {
        max-height: 22vh;
      }
    }
  </style>
</head>
<body class="live-mode">
  <div class="tv-hint" id="tvHint">Modo TV · F ou ESC para sair · ideal para televisão</div>
  <div class="board">
    <header class="topbar">
      <div class="brand">
        <img src="logo-binho.png" alt="BINHO Transportes" />
        <div class="title">COLETA</div>
      </div>
      <nav class="nav">
        <button type="button" class="nav-btn active" data-view="live">Ao vivo</button>
        <button type="button" class="nav-btn" data-view="gestao">Gestão</button>
        <button type="button" class="nav-btn tv-btn" id="btnTv" title="Modo TV / tela inteira (F)">TV</button>
      </nav>
      <div class="clock-box">
        <div class="lbl">Tempo real</div>
        <div class="time" id="clock">--:--:--</div>
        <div class="date" id="clockDate">—</div>
      </div>
    </header>

    <!-- AO VIVO -->
    <div class="view active" id="viewLive">
      <section class="arena">
        <div class="arena-body">
          <div class="col-left">
            <div class="total-hero">
              <span class="total-lbl">Total</span>
              <strong class="total-num" id="totalColetas">0</strong>
              <div class="total-mix" id="totalMix" aria-hidden="true">
                <span class="m-real" id="mixReal" style="flex:1"></span>
                <span class="m-rota" id="mixRota" style="flex:1"></span>
                <span class="m-par" id="mixPar" style="flex:1"></span>
                <span class="m-can" id="mixCan" style="flex:1"></span>
              </div>
              <div class="total-stats">
                <div class="s-real"><span>Realizada</span><b id="statReal">0</b></div>
                <div class="s-rota"><span>Em rota</span><b id="statRota">0</b></div>
                <div class="s-par"><span>Parado</span><b id="statPar">0</b></div>
                <div class="s-can"><span>Cancelada</span><b id="statCan">0</b></div>
              </div>
              <div class="total-sub" id="totalSub" hidden></div>
            </div>
            <div class="pop-stack" id="placaStack"></div>
          </div>
          <div class="col-center">
            <div class="torres">
              <div class="torre t-col">
                <div class="pin"><span id="rankReal">1</span></div>
                <div class="barra" id="barReal"><strong id="nReal">0<span class="pct-sign">%</span></strong></div>
                <div class="base"><div class="lbl">Realizada</div></div>
              </div>
              <div class="torre t-com">
                <div class="pin"><span id="rankRota">2</span></div>
                <div class="barra" id="barRota"><strong id="nRota">0<span class="pct-sign">%</span></strong></div>
                <div class="base"><div class="lbl">Em rota</div></div>
              </div>
              <div class="torre t-cad">
                <div class="pin"><span id="rankPar">3</span></div>
                <div class="barra" id="barPar"><strong id="nPar">0<span class="pct-sign">%</span></strong></div>
                <div class="base"><div class="lbl">Parado</div></div>
              </div>
              <div class="torre t-can">
                <div class="pin"><span id="rankCan">4</span></div>
                <div class="barra" id="barCan"><strong id="nCan">0<span class="pct-sign">%</span></strong></div>
                <div class="base"><div class="lbl">Cancelada</div></div>
              </div>
            </div>
          </div>
          <div class="col-right">
            <div class="pop-stack" id="prazoStack"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- GESTÃO -->
    <div class="view" id="viewGestao">
      <section class="panel">
        <h2>Gestão de coletas</h2>
        <div class="toolbar" id="tabsRelatorio">
          <button type="button" class="chip" data-rel="103">103 · Tempo real</button>
          <button type="button" class="chip active" data-rel="50">50 · Situações / histórico</button>
          <div class="search">
            <input id="buscaColeta" type="search" placeholder="Buscar nº coleta (ex: 071655 ou SPO071655)" />
            <button type="button" class="btn" id="btnBuscar">Buscar</button>
            <button type="button" class="btn" id="btnLimparBusca" style="background:#1e293b;border-color:#334155;">Limpar</button>
          </div>
        </div>
        <div class="toolbar" id="filtrosGestao"></div>
        <div class="lista">
          <table>
            <thead id="theadGestao"></thead>
            <tbody id="tbodyGestao"></tbody>
          </table>
        </div>
      </section>
    </div>

    <p class="status-line" id="statusLine">BINHO · COLETA</p>
  </div>

  <div class="modal-backdrop" id="modalHist" role="dialog" aria-modal="true">
    <div class="modal">
      <button type="button" class="close" id="btnFecharHist">Fechar</button>
      <h2 id="histTitulo">Histórico</h2>
      <p class="sub-hist" id="histSub"></p>
      <div id="histLista"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = (window.ACE_CONFIG && window.ACE_CONFIG.scriptUrl) || '';
    const JANELA_MIN = 120;
    const PLACA_VISIBLE = 3;
    const PRAZO_VISIBLE = 4;
    const PLACA_TICK_MS = 2800;
    const PRAZO_TICK_MS = 3200;
    const PCT_ANIM_MS = 900;

    let VIEW = 'live';
    let REL = '50';
    let TV_MODE = false;
    let wakeLock = null;
    let tvIdleTimer = null;
    let lastCounts = null;
    let FILTRO = 'TODAS';
    let BUSCA = '';
    let COLETAS = [];      // ao vivo (torres) — situacao atual do 50
    let COLETAS_50 = [];
    let COLETAS_103 = [];
    let PLACAS = [];
    let URGENTES = [];
    let placaCursor = 0;
    let prazoCursor = 0;
    let placaTimer = null;
    let prazoTimer = null;

    function pad(n) { return String(n).padStart(2, '0'); }

    function tickClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const dias = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
      document.getElementById('clockDate').textContent =
        `${dias[now.getDay()]} · ${pad(now.getDate())}/${pad(now.getMonth() + 1)}`;
    }

    async function chamarPlanilha(action, params = {}) {
      if (!SCRIPT_URL) throw new Error('Configure scriptUrl em config.js');
      const url = new URL(SCRIPT_URL);
      url.searchParams.set('action', action);
      url.searchParams.set('t', String(Date.now()));
      Object.entries(params).forEach(([k, v]) => {
        if (v != null && v !== '') url.searchParams.set(k, v);
      });
      const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      let dados;
      try { dados = JSON.parse(text); }
      catch { throw new Error('Apps Script inválido — publique Nova versão'); }
      if (!dados.ok) throw new Error(dados.error || 'Erro na planilha');
      return dados;
    }

    function coletaKey(r) {
      return String(r.coleta_id || r.coleta || `${r.unidade || ''}${r.numero || ''}`)
        .toUpperCase().replace(/\s+/g, '').trim();
    }

    function uniqueRows(rows) {
      const map = new Map();
      (rows || []).forEach(r => {
        const key = coletaKey(r);
        if (!key) return;
        if (!map.has(key)) map.set(key, r);
      });
      return Array.from(map.values());
    }

    function statusAce(c) {
      const raw = String(c.status_ace || '').toLowerCase().trim();
      if (['parado', 'em_rota', 'realizada', 'cancelada'].includes(raw)) return raw;
      const s = String(c.situacao_atual || '').toUpperCase();
      if (s.includes('CANCEL')) return 'cancelada';
      if (s.includes('COLET') || s.includes('REALIZ')) return 'realizada';
      if (s.includes('COMAND') || s.includes('ROTA')) return 'em_rota';
      if (s.includes('CADASTR') || s.includes('PARADO')) return 'parado';
      return 'outro';
    }

    function situacaoNorm50(c) {
      const s = String(c.situacao_atual || '').toUpperCase();
      if (s.includes('CANCEL')) return 'CANCELADA';
      if (s.includes('COLET')) return 'COLETADA';
      if (s.includes('COMAND')) return 'COMANDADA';
      if (s.includes('CADASTR')) return 'CADASTRADA';
      return '';
    }

    function parsePlaca(raw) {
      const text = String(raw || '').toUpperCase().trim();
      if (!text) return '';
      const m = text.match(/[A-Z]{3}\d[A-Z0-9]\d{2}|[A-Z]{3}\d{4}/);
      return m ? m[0] : text.split(/\s+/)[0];
    }

    function parseLimite(c) {
      const raw = String(c.data_hora_limite || '').trim();
      const now = new Date();
      let day = now.getDate(), month = now.getMonth() + 1, hour = 0, minute = 0, ok = false;
      let m = raw.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s+(\d{1,2}):(\d{2})/);
      if (m) {
        day = +m[1]; month = +m[2]; hour = +m[4]; minute = +m[5]; ok = true;
      } else {
        const dOnly = String(c.data_limite_inicial || '').match(/(\d{1,2})\/(\d{1,2})/);
        const hOnly = raw.match(/(\d{1,2}):(\d{2})/) || String(c.hora || '').match(/(\d{1,2}):(\d{2})/);
        if (dOnly) { day = +dOnly[1]; month = +dOnly[2]; ok = true; }
        if (hOnly) { hour = +hOnly[1]; minute = +hOnly[2]; ok = true; }
      }
      if (!ok) return null;
      const year = now.getFullYear();
      const dt = new Date(year, month - 1, day, hour, minute, 0, 0);
      if (dt.getTime() - now.getTime() > 180 * 86400000) dt.setFullYear(year - 1);
      if (now.getTime() - dt.getTime() > 180 * 86400000) dt.setFullYear(year + 1);
      return dt;
    }

    function minsUntil(dt) {
      return Math.round((dt.getTime() - Date.now()) / 60000);
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtCampo(valor, tipo) {
      const raw = String(valor ?? '').trim();
      if (!raw) return '';
      if (/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(raw)) return raw.slice(0, 5);
      if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(raw)) return raw.slice(0, 5);
      return raw;
    }

    function fmtDataHora(data, hora) {
      return [fmtCampo(data, 'data'), fmtCampo(hora, 'hora')].filter(Boolean).join(' ');
    }

    function alturaTorre(valor, max) {
      const vh = window.innerHeight || 800;
      const tv = document.body.classList.contains('tv-mode');
      const minH = Math.round(vh * (tv ? 0.10 : 0.07));
      const maxH = Math.round(vh * (tv ? 0.52 : 0.28));
      if (!max || max <= 0) return minH;
      return Math.round(minH + (valor / max) * (maxH - minH));
    }

    function countByStatus(rows) {
      const out = { total: 0, parado: 0, em_rota: 0, realizada: 0, cancelada: 0, outro: 0 };
      rows.forEach(c => {
        const s = statusAce(c);
        out.total += 1;
        if (out[s] != null) out[s] += 1;
        else out.outro += 1;
      });
      return out;
    }

    function renderTorres(counts) {
      const items = [
        { suf: 'Real', bar: 'barReal', val: counts.realizada || 0 },
        { suf: 'Rota', bar: 'barRota', val: counts.em_rota || 0 },
        { suf: 'Par', bar: 'barPar', val: counts.parado || 0 },
        { suf: 'Can', bar: 'barCan', val: counts.cancelada || 0 },
      ];
      const total = Math.max(0, Number(counts.total) || 0);
      const max = Math.max(...items.map(i => i.val), 1);

      // Ranking: 1 = maior quantidade, 2 = segundo, etc. Empate mantém ordem estável.
      const ranked = items
        .map((item, idx) => ({ ...item, idx }))
        .sort((a, b) => (b.val - a.val) || (a.idx - b.idx));
      const rankOf = {};
      ranked.forEach((item, i) => { rankOf[item.suf] = i + 1; });

      items.forEach(({ suf, bar, val }) => {
        const pct = total > 0 ? Math.round((val / total) * 100) : 0;
        const nEl = document.getElementById('n' + suf);
        nEl.innerHTML = `${pct}<span class="pct-sign">%</span>`;
        nEl.title = `${val} de ${total}`;
        document.getElementById('rank' + suf).textContent = String(rankOf[suf]);
        document.getElementById(bar).style.height = alturaTorre(val, max) + 'px';
      });
      document.getElementById('totalColetas').textContent = String(total);
      const parts = [
        ['mixReal', 'statReal', counts.realizada || 0],
        ['mixRota', 'statRota', counts.em_rota || 0],
        ['mixPar', 'statPar', counts.parado || 0],
        ['mixCan', 'statCan', counts.cancelada || 0],
      ];
      parts.forEach(([mixId, statId, val]) => {
        const mix = document.getElementById(mixId);
        const share = total > 0 ? val : 1;
        mix.style.flex = String(Math.max(share, 0));
        mix.style.display = total > 0 && val <= 0 ? 'none' : 'block';
        document.getElementById(statId).textContent = String(val);
      });
      const sub = document.getElementById('totalSub');
      if (sub) { sub.hidden = true; sub.textContent = ''; }
      lastCounts = counts;
    }

    function rerenderTorres() {
      if (lastCounts) renderTorres(lastCounts);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (_) { /* TV/browser pode negar */ }
    }

    async function releaseWakeLock() {
      try {
        if (wakeLock) await wakeLock.release();
      } catch (_) { /* ignore */ }
      wakeLock = null;
    }

    function showTvHint(ms = 4500) {
      const hint = document.getElementById('tvHint');
      if (!hint) return;
      hint.classList.add('show');
      clearTimeout(hint._t);
      hint._t = setTimeout(() => hint.classList.remove('show'), ms);
    }

    function bumpTvIdle() {
      document.body.classList.remove('tv-idle');
      clearTimeout(tvIdleTimer);
      if (!TV_MODE) return;
      tvIdleTimer = setTimeout(() => document.body.classList.add('tv-idle'), 2500);
    }

    async function enterFullscreen() {
      const el = document.documentElement;
      try {
        if (!document.fullscreenElement && el.requestFullscreen) {
          await el.requestFullscreen();
        }
      } catch (_) { /* usuário pode bloquear; CSS tv-mode ainda funciona */ }
    }

    async function exitFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
      } catch (_) { /* ignore */ }
    }

    async function setTvMode(on, { syncHash = true } = {}) {
      TV_MODE = !!on;
      document.body.classList.toggle('tv-mode', TV_MODE);
      const btn = document.getElementById('btnTv');
      if (btn) btn.textContent = TV_MODE ? 'Sair TV' : 'TV';

      if (TV_MODE) {
        setView('live');
        await enterFullscreen();
        await requestWakeLock();
        showTvHint();
        bumpTvIdle();
        if (syncHash && location.hash.replace('#', '') !== 'tv') {
          history.replaceState(null, '', '#tv');
        }
      } else {
        await exitFullscreen();
        await releaseWakeLock();
        document.body.classList.remove('tv-idle');
        clearTimeout(tvIdleTimer);
        document.getElementById('tvHint')?.classList.remove('show');
        if (syncHash && location.hash.replace('#', '') === 'tv') {
          history.replaceState(null, '', location.pathname + location.search);
        }
      }
      requestAnimationFrame(rerenderTorres);
      setTimeout(rerenderTorres, 80);
    }

    function toggleTvMode() {
      setTvMode(!TV_MODE);
    }

    function donutSvg(pct, color) {
      const p = Math.max(0, Math.min(100, pct || 0));
      const r = 14;
      const c = 2 * Math.PI * r;
      const dash = (p / 100) * c;
      return `<svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="${r}" fill="none" stroke="#1e293b" stroke-width="5"></circle>
        <circle class="arc" cx="20" cy="20" r="${r}" fill="none" stroke="${color}" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="0 ${c}" data-full="${dash} ${c - dash}"></circle>
      </svg>`;
    }

    function buildPlacas() {
      const byPlaca = new Map();
      COLETAS.forEach(c => {
        const st = statusAce(c);
        if (st === 'cancelada') return;
        const placa = parsePlaca(c.placa || c.veiculo || '');
        if (!placa) return;
        if (!byPlaca.has(placa)) byPlaca.set(placa, { placa, total: 0, feitas: 0, motorista: c.motorista || '' });
        const row = byPlaca.get(placa);
        row.total += 1;
        if (st === 'realizada') row.feitas += 1;
        if (!row.motorista && c.motorista) row.motorista = c.motorista;
      });
      return Array.from(byPlaca.values())
        .map(r => ({ ...r, pct: r.total ? Math.round((r.feitas / r.total) * 100) : 0 }))
        .sort((a, b) => a.pct - b.pct || b.total - a.total);
    }

    function buildUrgentes() {
      const out = [];
      COLETAS_50.forEach(c => {
        const sit = situacaoNorm50(c);
        if (!sit || sit === 'CANCELADA' || sit === 'COLETADA') return;
        const limite = parseLimite(c);
        if (!limite) return;
        const mins = minsUntil(limite);
        if (mins > JANELA_MIN) return;
        out.push({
          label: c.coleta || c.coleta_id || coletaKey(c),
          sit, limite, mins,
          veiculo: parsePlaca(c.veiculo || ''),
        });
      });
      out.sort((a, b) => a.mins - b.mins);
      return out;
    }

    function animateDonut(el, targetPct) {
      const arc = el.querySelector('.arc');
      const label = el.querySelector('.pct');
      if (!arc || !label) return;
      const full = arc.getAttribute('data-full') || '0 100';
      const end = Math.max(0, Math.min(100, targetPct || 0));
      const t0 = performance.now();
      const circ = 2 * Math.PI * 14;
      function frame(t) {
        const k = Math.min(1, (t - t0) / PCT_ANIM_MS);
        const cur = Math.round(end * (1 - Math.pow(1 - k, 3)));
        const dash = (cur / 100) * circ;
        arc.setAttribute('stroke-dasharray', `${dash} ${circ - dash}`);
        label.textContent = cur + '%';
        if (k < 1) requestAnimationFrame(frame);
        else arc.setAttribute('stroke-dasharray', full);
      }
      requestAnimationFrame(frame);
    }

    function layoutPops(stack, nodes) {
      let top = 0;
      nodes.forEach((node, i) => {
        node.style.top = top + 'px';
        node.style.zIndex = String(100 - i);
        top += node.offsetHeight + 10;
      });
    }

    function renderPlacaPops() {
      const stack = document.getElementById('placaStack');
      if (!PLACAS.length) {
        stack.innerHTML = '<div class="pop show" style="position:relative;opacity:.7;transform:none;"><div class="meta">Sem placas</div></div>';
        return;
      }
      const visible = [];
      const n = Math.min(PLACA_VISIBLE, PLACAS.length);
      for (let i = 0; i < n; i++) visible.push(PLACAS[(placaCursor + i) % PLACAS.length]);
      Array.from(stack.querySelectorAll('.pop')).forEach(el => {
        el.classList.remove('show'); el.classList.add('leaving');
        setTimeout(() => el.remove(), 480);
      });
      setTimeout(() => {
        const nodes = visible.map(p => {
          const color = p.pct >= 100 ? '#8cc63f' : p.pct >= 50 ? '#29abe2' : '#fff200';
          const el = document.createElement('div');
          el.className = 'pop pop-placa';
          el.innerHTML = `
            <div class="donut">${donutSvg(p.pct, color)}<div class="pct">0%</div></div>
            <div><div class="name">${esc(p.placa)}</div><div class="meta">${p.feitas}/${p.total}</div></div>
            <div class="badge">${p.pct}%</div>`;
          stack.appendChild(el);
          requestAnimationFrame(() => el.classList.add('show'));
          animateDonut(el, p.pct);
          return el;
        });
        layoutPops(stack, nodes);
      }, 120);
    }

    function renderPrazoPops() {
      const stack = document.getElementById('prazoStack');
      if (!URGENTES.length) {
        stack.innerHTML = '<div class="pop show" style="position:relative;opacity:.7;transform:none;"><div class="meta">Nada perto do limite</div></div>';
        return;
      }
      const visible = [];
      const n = Math.min(PRAZO_VISIBLE, URGENTES.length);
      for (let i = 0; i < n; i++) visible.push(URGENTES[(prazoCursor + i) % URGENTES.length]);
      Array.from(stack.querySelectorAll('.pop')).forEach(el => {
        el.classList.remove('show'); el.classList.add('leaving');
        setTimeout(() => el.remove(), 480);
      });
      setTimeout(() => {
        const nodes = visible.map(r => {
          const atrasada = r.mins < 0;
          const el = document.createElement('div');
          el.className = 'pop pop-prazo' + (atrasada ? ' perdida' : ' warn');
          const tag = atrasada ? 'PERDIDA' : `${r.mins}m`;
          el.innerHTML = `
            <div class="hora">${pad(r.limite.getHours())}:${pad(r.limite.getMinutes())}</div>
            <div>
              <div class="name" style="font-size:13px;">${esc(r.label)}</div>
              <div class="meta">${esc(r.sit)}${r.veiculo ? ' · ' + esc(r.veiculo) : ''}</div>
            </div>
            <div class="tag">${esc(tag)}</div>`;
          stack.appendChild(el);
          requestAnimationFrame(() => el.classList.add('show'));
          return el;
        });
        layoutPops(stack, nodes);
      }, 120);
    }

    function startPopLoops() {
      if (placaTimer) clearInterval(placaTimer);
      if (prazoTimer) clearInterval(prazoTimer);
      renderPlacaPops();
      renderPrazoPops();
      placaTimer = setInterval(() => {
        if (!PLACAS.length) return;
        placaCursor = (placaCursor + 1) % PLACAS.length;
        renderPlacaPops();
      }, PLACA_TICK_MS);
      prazoTimer = setInterval(() => {
        if (!URGENTES.length) return;
        if (URGENTES.length > PRAZO_VISIBLE) prazoCursor = (prazoCursor + 1) % URGENTES.length;
        renderPrazoPops();
      }, PRAZO_TICK_MS);
    }

    /* ===== GESTÃO ===== */
    function labelStatus103(s) {
      return ({ parado: 'Parado', em_rota: 'Em rota', realizada: 'Realizada', cancelada: 'Cancelada' })[s] || s;
    }

    function matchBusca(c) {
      if (!BUSCA) return true;
      const q = BUSCA.toUpperCase().replace(/\s+/g, '');
      const id = coletaKey(c);
      const num = String(c.numero || '').replace(/\D/g, '');
      const qNum = q.replace(/\D/g, '');
      return id.includes(q) || (qNum && (id.includes(qNum) || num.includes(qNum)));
    }

    function renderFiltrosGestao() {
      const box = document.getElementById('filtrosGestao');
      const opts103 = [
        ['TODAS', 'Todas'], ['realizada', 'Realizada'], ['em_rota', 'Em rota'],
        ['parado', 'Parado'], ['cancelada', 'Cancelada'],
      ];
      const opts50 = [
        ['TODAS', 'Todas'], ['COLETADA', 'Coletada'], ['COMANDADA', 'Comandada'],
        ['CADASTRADA', 'Cadastrada'], ['CANCELADA', 'Cancelada'],
      ];
      const opts = REL === '50' ? opts50 : opts103;
      if (!opts.some(([k]) => k === FILTRO)) FILTRO = 'TODAS';
      box.innerHTML = opts.map(([k, lbl]) =>
        `<button type="button" class="chip${FILTRO === k ? ' active' : ''}" data-filtro="${k}">${lbl}</button>`
      ).join('');
      box.querySelectorAll('[data-filtro]').forEach(btn => {
        btn.addEventListener('click', () => {
          FILTRO = btn.getAttribute('data-filtro');
          renderFiltrosGestao();
          renderTabelaGestao();
        });
      });
    }

    function renderTabelaGestao() {
      const thead = document.getElementById('theadGestao');
      const tbody = document.getElementById('tbodyGestao');
      if (REL === '50') {
        thead.innerHTML = `<tr>
          <th>Coleta</th><th>Situação atual</th><th>Quando</th>
          <th>Destino</th><th>Motorista</th><th></th></tr>`;
        let rows = COLETAS_50.filter(matchBusca);
        if (FILTRO !== 'TODAS') rows = rows.filter(c => situacaoNorm50(c) === FILTRO);
        rows = rows.slice().reverse().slice(0, 300);
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="muted">Nenhuma coleta 50.</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(c => {
          const sit = situacaoNorm50(c);
          const id = coletaKey(c);
          const label = c.coleta || c.coleta_id || id;
          return `<tr>
            <td>${esc(label)}</td>
            <td class="sit sit-${esc(sit)}">${esc(c.situacao_atual || sit)}</td>
            <td>${esc(fmtDataHora(c.situacao_atual_data, c.situacao_atual_hora))}</td>
            <td>${esc(c.dest_cidade || c.dest || '')}</td>
            <td>${esc(c.motorista || '')}</td>
            <td><button type="button" class="btn" data-hist="${esc(id)}" data-label="${esc(label)}" data-sit="${esc(sit)}">Histórico</button></td>
          </tr>`;
        }).join('');
        tbody.querySelectorAll('[data-hist]').forEach(btn => {
          btn.addEventListener('click', () => abrirHistorico(
            btn.getAttribute('data-hist'),
            btn.getAttribute('data-label'),
            btn.getAttribute('data-sit'),
            btn
          ));
        });
      } else {
        thead.innerHTML = `<tr>
          <th>Coleta</th><th>Status</th><th>Situação</th>
          <th>Hora</th><th>Placa</th><th>Carreta</th><th>Motorista</th></tr>`;
        let rows = COLETAS_103.filter(matchBusca);
        if (FILTRO !== 'TODAS') rows = rows.filter(c => statusAce(c) === FILTRO);
        rows = rows.slice().reverse().slice(0, 300);
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="muted">Nenhuma coleta 103.</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(c => {
          const st = statusAce(c);
          return `<tr>
            <td>${esc(c.coleta_id || '')}</td>
            <td class="sit sit-${esc(st)}">${esc(labelStatus103(st))}</td>
            <td>${esc(c.situacao_atual || '')}</td>
            <td>${esc(fmtCampo(c.hora, 'hora'))}</td>
            <td>${esc(c.placa || '')}</td>
            <td>${esc(c.placa_carreta || '')}</td>
            <td>${esc(c.motorista || '')}</td>
          </tr>`;
        }).join('');
      }
    }

    function histSortKey(data, hora) {
      const d = fmtCampo(data, 'data');
      const h = fmtCampo(hora, 'hora') || '00:00';
      const m = d.match(/(\d{1,2})\/(\d{1,2})/);
      if (!m) return '0000' + h;
      return pad(m[2]) + pad(m[1]) + h.replace(':', '');
    }

    function inferOcorrencia(obs) {
      const o = String(obs || '').toUpperCase();
      if (!o) return '';
      if (/CANCELAD/.test(o)) return '99-COLETA CANCELADA';
      if (/COLETA REALIZADA|CARREGADA NO VEICULO|CTRC GERADO/.test(o)) {
        return '01-COLETA REALIZADA (CARREGADA NO VEICULO)';
      }
      if (/COMANDADA/.test(o)) return '02-COLETA COMANDADA AO VEICU';
      if (/COLETA CADASTRADA|REMET:/.test(o) && /VOL|KG|DESTINO|HORARIO LIMITE/.test(o)) {
        return '98-COLETA CADASTRADA';
      }
      return '';
    }

    function renderHistoricoSsw(rows) {
      const sorted = (rows || []).slice().sort((a, b) =>
        histSortKey(b.data, b.hora).localeCompare(histSortKey(a.data, a.hora))
      );
      const body = sorted.map(h => {
        const inclusao = fmtDataHora(h.data, h.hora);
        const occ = inferOcorrencia(h.observacao);
        return `<tr>
          <td>${esc(inclusao)}</td>
          <td class="ctr">${esc((h.dominio || 'BIN').toUpperCase())}</td>
          <td class="ctr">${esc((h.unidade_evento || h.unidade || 'SPO').toUpperCase())}</td>
          <td>${esc(inclusao)}</td>
          <td class="user">${esc(h.usuario || '')}</td>
          <td>${esc(occ)}</td>
          <td class="instr">${esc(h.observacao || '')}</td>
          <td>${esc(occ)}</td>
        </tr>`;
      }).join('');
      return `<div class="ssw-wrap"><table class="ssw-hist">
        <thead><tr>
          <th>Inclusão</th><th>Domi</th><th>Fili:</th><th>Inclusão Local</th>
          <th>Usuário</th><th>Ocorrência</th><th>Instruções / situação</th><th>Ocorrência SSW</th>
        </tr></thead><tbody>${body || '<tr><td colspan="8">Sem eventos</td></tr>'}</tbody></table></div>`;
    }

    async function abrirHistorico(coletaId, label, situacao, btn) {
      const modal = document.getElementById('modalHist');
      const lista = document.getElementById('histLista');
      document.getElementById('histTitulo').textContent = `Histórico · ${label || coletaId}`;
      document.getElementById('histSub').textContent = `Situação atual: ${situacao || '—'}`;
      lista.innerHTML = '<p class="sub-hist">Carregando…</p>';
      modal.classList.add('open');
      if (btn) btn.disabled = true;
      try {
        const resp = await chamarPlanilha('historico', { coleta_id: coletaId });
        const rows = resp.rows || [];
        lista.innerHTML = rows.length
          ? renderHistoricoSsw(rows)
          : '<p class="sub-hist">Sem histórico nesta coleta.</p>';
      } catch (err) {
        lista.innerHTML = `<p class="sub-hist">${esc(err.message)}</p>`;
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function setView(view) {
      VIEW = view === 'gestao' ? 'gestao' : 'live';
      if (VIEW === 'gestao' && TV_MODE) setTvMode(false, { syncHash: true });
      document.body.classList.toggle('live-mode', VIEW === 'live');
      document.querySelectorAll('.nav-btn[data-view]').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-view') === VIEW);
      });
      document.getElementById('viewLive').classList.toggle('active', VIEW === 'live');
      document.getElementById('viewGestao').classList.toggle('active', VIEW === 'gestao');
      if (VIEW === 'gestao') {
        renderFiltrosGestao();
        renderTabelaGestao();
      }
    }

    function setRel(rel) {
      REL = rel === '50' ? '50' : '103';
      FILTRO = 'TODAS';
      document.querySelectorAll('#tabsRelatorio [data-rel]').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-rel') === REL);
      });
      renderFiltrosGestao();
      renderTabelaGestao();
    }

    async function refresh() {
      const status = document.getElementById('statusLine');
      try {
        const [r103, r50] = await Promise.all([
          chamarPlanilha('coletas103').catch(() => null),
          chamarPlanilha('coletas').catch(() => ({ rows: [] })),
        ]);
        COLETAS_50 = uniqueRows((r50 && r50.rows) || []);
        COLETAS_103 = uniqueRows((r103 && r103.rows) || []);

        // Torres ao vivo = somente 103 (situacao atual tempo real)
        // 50 fica so na Gestao (busca + historico)
        COLETAS = COLETAS_103.slice();

        const counts = countByStatus(COLETAS);
        renderTorres(counts);
        PLACAS = buildPlacas();
        URGENTES = buildUrgentes();
        placaCursor = 0;
        prazoCursor = 0;
        startPopLoops();
        if (VIEW === 'gestao') {
          renderFiltrosGestao();
          renderTabelaGestao();
        }
        status.textContent =
          `Atualizado ${new Date().toLocaleTimeString('pt-BR')} · torres(103): ${COLETAS.length} · gestao(50): ${COLETAS_50.length}`;
      } catch (err) {
        status.textContent = err.message;
        const sub = document.getElementById('totalSub');
        if (sub) {
          sub.hidden = false;
          sub.style.display = 'block';
          sub.style.color = '#fca5a5';
          sub.style.fontSize = '11px';
          sub.style.marginTop = '8px';
          sub.textContent = err.message;
        }
      }
    }

    document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
      btn.addEventListener('click', () => setView(btn.getAttribute('data-view')));
    });
    document.getElementById('btnTv').addEventListener('click', () => toggleTvMode());
    document.querySelectorAll('#tabsRelatorio [data-rel]').forEach(btn => {
      btn.addEventListener('click', () => setRel(btn.getAttribute('data-rel')));
    });
    document.getElementById('btnBuscar').addEventListener('click', () => {
      BUSCA = document.getElementById('buscaColeta').value.trim();
      renderTabelaGestao();
    });
    document.getElementById('buscaColeta').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        BUSCA = e.target.value.trim();
        renderTabelaGestao();
      }
    });
    document.getElementById('btnLimparBusca').addEventListener('click', () => {
      BUSCA = '';
      document.getElementById('buscaColeta').value = '';
      renderTabelaGestao();
    });
    document.getElementById('btnFecharHist').addEventListener('click', () => {
      document.getElementById('modalHist').classList.remove('open');
    });
    document.getElementById('modalHist').addEventListener('click', (e) => {
      if (e.target.id === 'modalHist') e.currentTarget.classList.remove('open');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') return; // deixa o browser cuidar
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'f' || e.key === 'F' || e.key === 't' || e.key === 'T') {
        e.preventDefault();
        toggleTvMode();
      } else if (e.key === 'Escape' && TV_MODE) {
        setTvMode(false);
      }
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && TV_MODE) {
        // saiu do fullscreen pelo ESC nativo — mantém layout TV ou sai?
        // mantém CSS tv-mode para caber na TV sem fullscreen se o browser bloquear
      }
    });
    ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(ev => {
      document.addEventListener(ev, bumpTvIdle, { passive: true });
    });
    window.addEventListener('resize', () => {
      clearTimeout(window._tvResize);
      window._tvResize = setTimeout(rerenderTorres, 120);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && TV_MODE) requestWakeLock();
    });

    const hash = (location.hash || '').replace('#', '').toLowerCase();
    if (hash === 'tv' || hash === 'fullscreen' || hash === 'tela') {
      setView('live');
      setTvMode(true, { syncHash: false });
    } else if (hash === 'gestao' || hash === '50' || hash === '103') {
      setView('gestao');
      if (hash === '50' || hash === '103') setRel(hash);
    }

    tickClock();
    setInterval(tickClock, 1000);
    refresh();
    setInterval(refresh, 20000);
  </script>
</body>
</html>
