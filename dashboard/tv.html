  <script>
    (function () {
      var slot = null;
      try { slot = localStorage.getItem('ace_tv_slot'); } catch (e) {}
      var n = parseInt(slot || '', 10);
      var hash = (n >= 1 && n <= 6) ? ('#tv/slot/' + n) : '#tv';
      location.replace('./index.html' + hash);
    })();
  </script>
