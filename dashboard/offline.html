<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>BINHO · COLETA · INTERROMPIDO</title>
  <style>
    :root {
      --can: #ed1c24;
      --can-dark: #7f1d1d;
    }
    html, body {
      height: 100%; margin: 0;
      background:
        radial-gradient(800px 400px at 50% 20%, rgba(237,28,36,.2), transparent 60%),
        #05080f;
      color: #e2e8f0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--can-dark);
      border-radius: 20px;
      padding: clamp(28px, 4vmin, 48px) clamp(24px, 3vmin, 40px);
      background: linear-gradient(180deg, #1a0a0a, #0b1220);
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }
    .badge {
      display: inline-block;
      background: var(--can-dark);
      color: #fff;
      font-size: clamp(12px, 1.4vmin, 16px);
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4.5vmin, 44px);
      font-weight: 800;
      letter-spacing: .04em;
    }
    p {
      margin: 0;
      color: #cbd5e1;
      font-size: clamp(14px, 1.8vmin, 20px);
      line-height: 1.45;
    }
    .when {
      margin-top: 16px;
      color: #94a3b8;
      font-size: clamp(12px, 1.3vmin, 15px);
    }
  </style>
  <script>
    async function applyStatus() {
      try {
        var r = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
        var d = await r.json();
        if (d && d.online !== false && d.online !== 'false' && d.online !== 0) {
          location.replace('index.html' + (location.search || '') + (location.hash || ''));
          return;
        }
        var msg = document.getElementById('msg');
        var when = document.getElementById('when');
        if (msg) msg.textContent = (d && d.message) || 'Sistema temporariamente interrompido.';
        if (when && d && d.updated_at) when.textContent = 'Desde ' + String(d.updated_at).replace('T', ' ');
      } catch (e) {}
    }
    applyStatus();
    setInterval(applyStatus, 5000);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">BINHO · COLETA</div>
      <h1>INTERROMPIDO</h1>
      <p id="msg">Sistema temporariamente interrompido.</p>
      <div class="when" id="when"></div>
    </div>
  </div>
</body>
</html>
