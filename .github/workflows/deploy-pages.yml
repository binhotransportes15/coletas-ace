name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # v2: evita fila presa no grupo antigo "pages" (runs waiting eternas no Actions)
  group: pages-deploy-v2
  # Não cancelar: push de CSV (chore) logo após feature matava o deploy do HTML
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp dashboard version
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          # Só o UI (HTML/CSS/JS) dispara reload nas TVs.
          # CSV/dados mudam a cada chore — não devem derrubar a tela.
          ui_files = [
              Path("dashboard/index.html"),
              Path("dashboard/config.js"),
              Path("dashboard/tv_layout.json"),
          ]
          h = hashlib.sha256()
          for p in ui_files:
              if p.is_file():
                  h.update(p.read_bytes())
          ui_build = h.hexdigest()[:12]

          path = Path("dashboard/version.json")
          payload = {
              "build": ui_build,
              "commit": (os.environ.get("GITHUB_SHA") or "")[:12] or "local",
              "run": os.environ.get("GITHUB_RUN_ID", ""),
              "at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("wrote", path, payload)
          PY
      - name: Build Pages tree
        run: |
          # App na raiz E em /dashboard/ (bookmarks / index do repo).
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/dashboard
          cp -a dashboard/. _site/
          cp -a dashboard/. _site/dashboard/
          test -f _site/index.html
          test -f _site/dashboard/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        # Evita falha/fila quando outro deploy Pages ainda está ativo
        continue-on-error: false
